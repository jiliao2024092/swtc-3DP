<!-- ⑦ 主 App -->
<script type="text/babel" data-presets="react">
const { useState: useStateApp, useEffect: useEffectApp } = React;

function LoginPage({ onLogin }) {
  const [email, setEmail] = useStateApp('');
  const [pw, setPw] = useStateApp('');
  const [err, setErr] = useStateApp('');
  const [busy, setBusy] = useStateApp(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!email || !pw) { setErr('請填寫帳號與密碼'); return; }
    setBusy(true); setErr('');
    try {
      const cred = await FBAuth.signIn(email, pw);
      const user = await FBAuth.getUser(cred.user.uid);
      if (!user || !user.active) { await FBAuth.signOut(); setErr('帳號未啟用，請聯絡管理員'); setBusy(false); return; }
      onLogin(user);
    } catch(ex) {
      setErr('帳號或密碼錯誤');
      setBusy(false);
    }
  };

  return (
    <div className="login-page">
      <div className="login-card">
        <div className="login-brand">
          <div className="login-brand-mark"/>
          <h1>3D 列印管理平台</h1>
          <p>SWTC · PORTAL v3</p>
        </div>
        {err && <div className="login-err show">{err}</div>}
        <form onSubmit={submit}>
          <div className="login-fg"><label>電子郵件</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com" autoFocus/></div>
          <div className="login-fg"><label>密碼</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••"/></div>
          <button className="login-submit" type="submit" disabled={busy}>{busy?'登入中...':'登入'}</button>
        </form>
      </div>
    </div>
  );
}

/* 使用者 Modal — 獨立元件，使用 React.useState 避免 Hooks alias 問題 */
function UserModal({ item, onClose, onSaved, otherAdmins=0, callerIsAdmin=true }) {
  const PERMS   = window.PERMS_MAP   || {};
  const PRESETS = window.ROLE_PRESETS || {};
  // 主管（非 admin）呼叫時：不能編輯既有的 admin 使用者、不能個別勾選權限、套用角色不能選「管理員」
  const targetIsAdmin = !!(item && (item.permissions||[]).includes('admin'));
  const blockedForManager = !callerIsAdmin && targetIsAdmin;
  const INP = { width:'100%', padding:'8px 11px', border:'1.5px solid var(--line)', borderRadius:6, fontSize:13, fontFamily:'inherit', outline:'none', background:'var(--bg)', color:'var(--ink)' };
  const LBL = { display:'block', fontSize:11.5, fontWeight:600, color:'var(--ink-3)', marginBottom:5 };

  // 地區：新帳號預設中區（既有資料全部歸中，新人多半也在中區）。
  // ★ 決策 E 的防呆之一 —— 這裡是單選且不允許空值；沒設地區的人之後會什麼都看不到，
  //   所以寧可給一個預設值，也不要放行空白。
  const REGION_OPTS = window.REGIONS || [{key:'central',label:'中部'}];
  const empty = { displayName:'', email:'', password:'', permissions:['view_board','view_issues','view_booking','view_inventory','view_quote'], active:true, region:'central' };
  // 既有帳號沒有 region 欄位 → 開啟編輯視窗時就補成中區，存檔後這個人就「明確」歸中區
  // （regions.js 的 hasExplicitRegion 會據此判斷要不要在列表標紅）
  const [form, setForm] = React.useState(item ? {...item, password:'', region:(window.normRegion ? window.normRegion(item.region) : (item.region||'central'))} : empty);
  const [busy, setBusy] = React.useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const togglePerm = p => set('permissions', form.permissions.includes(p) ? form.permissions.filter(x=>x!==p) : [...form.permissions,p]);
  const applyPreset = role => set('permissions', PRESETS[role]||[]);

  const save = async () => {
    if (blockedForManager) { showToast('主管無法異動管理員帳號','err'); return; }
    if (!callerIsAdmin && form.permissions.includes('admin')) { showToast('主管無法將使用者設為管理員','err'); return; }
    if (!form.displayName || !form.email) { showToast('請填姓名與 Email','err'); return; }
    if (!item && !form.password) { showToast('請設定密碼','err'); return; }
    // 決策 E 的防呆：地區必填且必須是合法區碼。沒設地區的人在分區上線後會看不到任何資料，
    // 而且是靜默的（不會報錯），所以在寫入前就擋下來。
    if (!window.isRegion || !window.isRegion(form.region)) { showToast('請選擇地區','err'); return; }
    if (item && (item.permissions||[]).includes('admin') && !form.permissions.includes('admin') && otherAdmins===0) {
      showToast('至少需保留一位管理員，無法移除此帳號的管理員權限','err'); return;
    }
    setBusy(true);
    try {
      if (item) {
        await FBAuth.updateUser(item._id, { displayName:form.displayName, permissions:form.permissions, active:form.active, region:form.region });
        showToast('已更新 ✓');
      } else {
        await FBAuth.createUser(form.email, form.password, { displayName:form.displayName, email:form.email, permissions:form.permissions, active:form.active, region:form.region });
        showToast('已新增 ✓');
      }
      onSaved && onSaved();
      onClose();
    } catch(e) {
      console.error('[UserModal save] 失敗:', e);
      const msg = e.code === 'permission-denied'
        ? '權限不足：請確認你的帳號是 admin，且 firestore.rules 已部署最新版'
        : (e.message || '儲存失敗');
      showToast(msg, 'err');
    }
    finally { setBusy(false); }
  };

  return (
    <div className="m-overlay">
      <div className="m-box" style={{width:560}}>
        <div className="m-hd"><h3>{item?'✏️ 編輯使用者':'➕ 新增使用者'}</h3><button className="m-close" onClick={onClose}>×</button></div>
        <div className="m-body">
          <div className="m-row">
            <div className="m-field"><label style={LBL}>顯示名稱 *</label><input style={INP} value={form.displayName} onChange={e=>set('displayName',e.target.value)}/></div>
            <div className="m-field"><label style={LBL}>電子郵件 *</label><input style={INP} type="email" value={form.email} onChange={e=>set('email',e.target.value)} disabled={!!item}/></div>
          </div>
          {!item && <div className="m-field"><label style={LBL}>初始密碼 *</label><input style={INP} type="password" value={form.password} onChange={e=>set('password',e.target.value)}/></div>}
          <div className="m-row">
            <div className="m-field">
              <label style={LBL}>啟用狀態</label>
              <div className="seg" style={{marginTop:4}}>
                {[true,false].map(v=><button key={String(v)} className={`seg-btn${form.active===v?' active':''}`} onClick={()=>set('active',v)}>{v?'✅ 啟用':'⛔ 停用'}</button>)}
              </div>
            </div>
            <div className="m-field">
              <label style={LBL}>地區 *</label>
              <div className="seg" style={{marginTop:4}}>
                {REGION_OPTS.map(r=><button key={r.key} className={`seg-btn${form.region===r.key?' active':''}`} onClick={()=>set('region',r.key)}>{r.label}</button>)}
              </div>
              <div style={{fontSize:11,color:'var(--ink-4)',marginTop:5,lineHeight:1.6}}>
                每人只能屬於一個地區。主管可檢視全部地區，但只能編輯自己所屬地區的資料。
              </div>
            </div>
          </div>
          {blockedForManager ? (
            <div style={{padding:'12px 14px',background:'var(--warn-soft)',border:'1px solid #e8d9a8',borderRadius:8,fontSize:12.5,color:'var(--warn)',lineHeight:1.7}}>
              ⚠ 主管無法異動管理員帳號的權限，請洽 admin 處理。
            </div>
          ) : <>
            <div className="m-field">
              <label style={LBL}>角色快速套用</label>
              <div className="preset-row">
                {(callerIsAdmin
                  ? [['admin','p-admin','管理員'],['manager','p-mgr','主管'],['operator','p-eng','工程師'],['viewer','p-view','查閱']]
                  : [['manager','p-mgr','主管'],['operator','p-eng','工程師'],['viewer','p-view','查閱']]
                ).map(([r,cls,l])=>(
                  <button key={r} className={`preset-chip ${cls}`} onClick={()=>applyPreset(r)}>{l}</button>
                ))}
              </div>
            </div>
            {callerIsAdmin && <div className="m-field">
              <label style={LBL}>個別權限</label>
              <div className="perm-grid">
                {Object.entries(PERMS).map(([p,label])=>(
                  <label key={p} className={`perm-chip${form.permissions.includes(p)?' on':''}`}>
                    <input type="checkbox" checked={form.permissions.includes(p)} onChange={()=>togglePerm(p)}/>{label}
                  </label>
                ))}
              </div>
            </div>}
            {!callerIsAdmin && <div style={{fontSize:11.5,color:'var(--ink-4)'}}>主管僅能套用角色預設，個別權限勾選請洽 admin。</div>}
          </>}
        </div>
        <div className="m-foot">
          <button className="btn-cancel" onClick={onClose}>取消</button>
          <button className="btn-save" onClick={save} disabled={busy}>{busy?'儲存中...':'💾 儲存'}</button>
        </div>
      </div>
    </div>
  );
}

/* 管理員後台 */
/* ══ 公告欄 ═══════════════════════════════════════════════
   內容為 HTML；插入的圖片會壓縮後以 base64 內嵌在同一筆 Firestore 文件，
   刪除公告即一併刪掉圖片（刻意不放 Storage，避免孤兒檔案累積）。
   Firestore 單筆文件上限 1MB，故存檔前擋掉過大的內容。 */
const ANN_ROLES = [
  {key:'admin',    label:'管理員'},
  {key:'manager',  label:'主管'},
  {key:'operator', label:'工程師'},
  {key:'viewer',   label:'查閱'},
];
const ANN_MODES = [
  {key:'always',      label:'每次開啟系統都彈出',                 hint:'不提供關閉選項，使用者每次開啟系統都會看到'},
  {key:'dismissible', label:'每次開啟系統彈出，但可勾選「以後不顯示」', hint:'由使用者自行決定是否不再顯示'},
  {key:'once',        label:'開啟系統後只跳顯一次',               hint:'使用者看過一次後就不再自動彈出'},
];
const ANN_MAX_LEN = 800000;   // 預留空間給標題/角色等欄位，避免逼近 Firestore 1MB 上限
const annModeLabel = m => (ANN_MODES.find(x=>x.key===m)||ANN_MODES[1]).label;
const annRoleText  = rs => (!Array.isArray(rs)||rs.length===0||rs.length===ANN_ROLES.length)
  ? '全部角色'
  : ANN_ROLES.filter(r=>rs.includes(r.key)).map(r=>r.label).join('、');
// 已看過／已關閉狀態存 localStorage（帳號 + 公告 id）：一般使用者無權寫自己的 users 文件
// （見 firestore.rules），且這樣可省下大量 Firestore 寫入配額
const annSeenKey = (uid, id) => `swtc_ann_${uid}_${id}`;

function AnnouncementEditor({ init, saving, onCancel, onSave }) {
  const edRef   = React.useRef(null);
  const fileRef = React.useRef(null);
  const [title, setTitle] = React.useState(init.title || '');
  const [roles, setRoles] = React.useState(
    Array.isArray(init.roles) && init.roles.length ? init.roles : ANN_ROLES.map(r=>r.key));
  const [mode,  setMode]  = React.useState(init.mode || 'dismissible');

  // contenteditable 走非受控：只在切換編輯對象時灌入內容，否則每次 render 都會把游標打回開頭
  React.useEffect(()=>{ if(edRef.current) edRef.current.innerHTML = init.content || ''; }, [init._id]);

  const exec = (cmd, val) => { if(edRef.current) edRef.current.focus(); document.execCommand(cmd, false, val==null?null:val); };

  const insertImage = (file) => {
    if(!/^image\//.test(file.type)) { showToast('請選擇圖片檔','err'); return; }
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1000/Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width  = Math.max(1, Math.round(img.width  * scale));
        cv.height = Math.max(1, Math.round(img.height * scale));
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);  // JPEG 沒有透明色，先鋪白避免透明區變黑
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        exec('insertImage', cv.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = ()=>showToast('圖片讀取失敗','err');
      img.src = rd.result;
    };
    rd.onerror = ()=>showToast('圖片讀取失敗','err');
    rd.readAsDataURL(file);
  };

  const toggleRole = k => setRoles(rs => rs.includes(k) ? rs.filter(x=>x!==k) : [...rs, k]);

  const submit = () => {
    const content = edRef.current ? edRef.current.innerHTML : '';
    const text    = edRef.current ? edRef.current.textContent.trim() : '';
    if(!title.trim())                      { showToast('請填寫公告標題','err'); return; }
    if(!text && !/<img/i.test(content))    { showToast('公告內容不可空白','err'); return; }
    if(!roles.length)                      { showToast('請至少勾選一個公告對象','err'); return; }
    if(content.length > ANN_MAX_LEN)       { showToast('公告內容過大（圖片太多或太大），請刪減後再儲存','err'); return; }
    onSave({ title:title.trim(), content, roles, mode });
  };

  const TBTN = (label, cmd, style) => (
    <button type="button" title={label} style={style} onMouseDown={e=>e.preventDefault()} onClick={()=>exec(cmd)}>{label}</button>
  );

  return (
    <div className="ann-card">
      <input style={{width:'100%',padding:'9px 12px',border:'1.5px solid var(--line)',borderRadius:6,fontSize:14,fontWeight:600,fontFamily:'inherit',outline:'none',background:'var(--bg)',color:'var(--ink)',marginBottom:12}}
        placeholder="公告標題" value={title} onChange={e=>setTitle(e.target.value)}/>

      <div className="ann-tb">
        <select defaultValue="" title="文字大小" onChange={e=>{ if(e.target.value) exec('fontSize', e.target.value); e.target.value=''; }}>
          <option value="" disabled>字級</option>
          <option value="2">小</option>
          <option value="3">一般</option>
          <option value="5">大</option>
          <option value="6">特大</option>
        </select>
        <span className="sep"/>
        {TBTN('B','bold',{fontWeight:800})}
        {TBTN('I','italic',{fontStyle:'italic'})}
        {TBTN('U','underline',{textDecoration:'underline'})}
        <span className="sep"/>
        <input type="color" defaultValue="#d92b2b" title="文字顏色" onChange={e=>exec('foreColor', e.target.value)}/>
        <span className="sep"/>
        <button type="button" title="項目符號" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('insertUnorderedList')}>• 清單</button>
        <button type="button" title="編號清單" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('insertOrderedList')}>1. 清單</button>
        <button type="button" title="減少縮排" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('outdent')}>⇤</button>
        <button type="button" title="增加縮排" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('indent')}>⇥</button>
        <span className="sep"/>
        <button type="button" title="靠左對齊" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('justifyLeft')}>左</button>
        <button type="button" title="置中對齊" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('justifyCenter')}>中</button>
        <button type="button" title="靠右對齊" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('justifyRight')}>右</button>
        <span className="sep"/>
        <button type="button" title="插入圖片" onMouseDown={e=>e.preventDefault()} onClick={()=>fileRef.current&&fileRef.current.click()}>插入圖片</button>
        <button type="button" title="清除選取文字的格式" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('removeFormat')}>清除格式</button>
      </div>
      <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}}
        onChange={e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(f) insertImage(f); }}/>
      <div ref={edRef} className="ann-ed" contentEditable suppressContentEditableWarning/>
      <div style={{fontSize:11,color:'var(--ink-4)',marginTop:6}}>圖片會自動縮到長邊 1000px 並壓縮後內嵌於公告中；刪除公告時圖片一併移除。</div>

      <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',margin:'18px 0 8px'}}>公告對象</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:14,marginBottom:4}}>
        {ANN_ROLES.map(r=>(
          <label key={r.key} style={{display:'flex',alignItems:'center',gap:6,fontSize:13,color:'var(--ink-2)',cursor:'pointer'}}>
            <input type="checkbox" checked={roles.includes(r.key)} onChange={()=>toggleRole(r.key)} style={{width:15,height:15,cursor:'pointer'}}/>
            {r.label}
          </label>
        ))}
      </div>

      <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',margin:'18px 0 8px'}}>跳顯方式</div>
      {ANN_MODES.map(m=>(
        <label key={m.key} className={'ann-opt'+(mode===m.key?' on':'')}>
          <input type="radio" name="ann-mode" checked={mode===m.key} onChange={()=>setMode(m.key)} style={{marginTop:2,cursor:'pointer'}}/>
          <span>
            <span style={{display:'block',fontSize:13,fontWeight:600,color:'var(--ink)'}}>{m.label}</span>
            <span style={{display:'block',fontSize:11,color:'var(--ink-4)',marginTop:2}}>{m.hint}</span>
          </span>
        </label>
      ))}

      <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:16}}>
        <button className="btn-cancel" onClick={onCancel}>取消</button>
        <button className="btn-save" onClick={submit} disabled={saving}>{saving?'儲存中…':'💾 儲存公告'}</button>
      </div>
    </div>
  );
}

function AnnouncementAdmin({ user }) {
  const [list, setList]       = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [editing, setEditing] = React.useState(null);   // 正在編輯的公告（新增時為沒有 _id 的空物件）
  const [saving, setSaving]   = React.useState(false);

  React.useEffect(()=>{
    const un = FBAnnouncements.onSnapshot(rows => { setList(rows); setLoading(false); });
    return ()=>{ if(un) un(); };
  },[]);

  const save = async (data) => {
    setSaving(true);
    try {
      if(editing && editing._id) await FBAnnouncements.update(editing._id, data);
      else await FBAnnouncements.add({ ...data, enabled:true, author:user.displayName||user.email||'' });
      setEditing(null);
      showToast('公告已儲存 ✓');
    } catch(e){ showToast('儲存失敗：'+(e.message||e),'err'); }
    setSaving(false);
  };

  const toggleEnabled = async (a) => {
    try { await FBAnnouncements.update(a._id, { enabled: a.enabled === false }); }
    catch(e){ showToast('更新失敗：'+(e.message||e),'err'); }
  };

  const del = async (a) => {
    if(!confirm(`確定刪除公告「${a.title||'未命名'}」？內含圖片也會一併刪除。`)) return;
    try { await FBAnnouncements.del(a._id); if(editing&&editing._id===a._id) setEditing(null); showToast('已刪除','inf'); }
    catch(e){ showToast('刪除失敗：'+(e.message||e),'err'); }
  };

  if(loading) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:200,color:'var(--ink-4)',fontSize:14}}>⏳ 載入中...</div>;

  return (
    <div style={{maxWidth:760}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <h2 style={{fontSize:16,fontWeight:700}}>公告欄</h2>
        <button className="btn-add" onClick={()=>setEditing({title:'',content:'',roles:ANN_ROLES.map(r=>r.key),mode:'dismissible'})}>+ 新增公告</button>
      </div>
      <div style={{fontSize:12,color:'var(--ink-4)',marginBottom:16,lineHeight:1.7}}>
        左側勾選＝正在公告中，取消勾選即停止公告（內容保留）。點公告標題可展開編輯。
      </div>

      {editing && !editing._id &&
        <AnnouncementEditor key="new" init={editing} saving={saving} onCancel={()=>setEditing(null)} onSave={save}/>}

      {list.length===0 && !editing &&
        <div style={{padding:'28px 16px',background:'var(--bg-soft)',border:'1px solid var(--line)',borderRadius:8,color:'var(--ink-4)',fontSize:13,textAlign:'center'}}>
          尚無公告，點右上角「+ 新增公告」建立第一則。
        </div>}

      {list.map(a=>{
        if(editing && editing._id===a._id)
          return <AnnouncementEditor key={a._id} init={editing} saving={saving} onCancel={()=>setEditing(null)} onSave={save}/>;
        const on = a.enabled !== false;
        return (
          <div key={a._id} className={'ann-row'+(on?'':' off')}>
            <input type="checkbox" checked={on} onChange={()=>toggleEnabled(a)}
              title={on?'公告中（取消勾選即停止公告）':'未公告（勾選即開始公告）'}
              style={{width:16,height:16,cursor:'pointer',flexShrink:0}}/>
            <button className="ann-row-main" onClick={()=>setEditing(a)} title="點擊展開編輯">
              <span className="ann-title">{a.title||'(未命名公告)'}</span>
              <span className="ann-chip">{annModeLabel(a.mode)}</span>
              <span className="ann-chip">{annRoleText(a.roles)}</span>
            </button>
            <button className="kt-actbtn danger" title="刪除公告" onClick={()=>del(a)}>✕</button>
          </div>
        );
      })}
    </div>
  );
}

/* 開啟系統時的公告跳顯：依角色分級過濾，多則時依序顯示 */
function AnnouncementPopup({ user }) {
  const [queue, setQueue] = React.useState([]);
  const [idx, setIdx]     = React.useState(0);
  const [dismiss, setDismiss] = React.useState(false);
  const uid = user._id || user.email || 'anon';

  React.useEffect(()=>{
    let alive = true;
    (async()=>{
      let rows;
      try { rows = await FBAnnouncements.list(); }
      catch(e){ console.error('[announcements] 讀取失敗:', e); return; }
      if(!alive) return;
      const tier = window.roleTierOf(user);
      setQueue(rows.filter(a=>{
        if(a.enabled === false) return false;
        if(Array.isArray(a.roles) && a.roles.length && !a.roles.includes(tier)) return false;
        if(a.mode === 'always') return true;   // 每次都彈：不看已讀紀錄
        let seen = null;
        try { seen = localStorage.getItem(annSeenKey(uid, a._id)); } catch(e){}
        return !seen;
      }));
    })();
    return ()=>{ alive = false; };
  },[]);

  if(idx >= queue.length) return null;
  const a = queue[idx];
  const next = () => {
    try {
      if(a.mode === 'once') localStorage.setItem(annSeenKey(uid, a._id), 'seen');
      else if(a.mode === 'dismissible' && dismiss) localStorage.setItem(annSeenKey(uid, a._id), 'dismissed');
    } catch(e){}
    setDismiss(false);
    setIdx(i=>i+1);
  };

  return (
    <div className="m-overlay" style={{zIndex:6000}}>
      <div className="m-box" style={{width:600}}>
        <div className="m-hd">
          <h3>📢 {a.title||'公告'}</h3>
          {queue.length>1 && <span style={{fontSize:11,color:'var(--ink-4)'}}>{idx+1} / {queue.length}</span>}
        </div>
        <div className="m-body">
          <div className="ann-view" dangerouslySetInnerHTML={{__html:a.content||''}}/>
        </div>
        <div className="m-foot" style={{justifyContent:'space-between',alignItems:'center'}}>
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--ink-3)',cursor:'pointer',visibility:a.mode==='dismissible'?'visible':'hidden'}}>
            <input type="checkbox" checked={dismiss} onChange={e=>setDismiss(e.target.checked)} style={{width:15,height:15,cursor:'pointer'}}/>
            以後不顯示
          </label>
          <button className="btn-save" onClick={next}>{idx+1<queue.length?'下一則 →':'我知道了'}</button>
        </div>
      </div>
    </div>
  );
}

function AdminPanel({ user, isAdmin }) {
  const K = window.K;
  const {useState: useSt, useEffect: useEff} = React;
  // 兩種後台權限可各自獨立：只有 manage_announcements 的人進得來，但只看得到「公告欄」
  const canUsers    = isAdmin || window.hasPerm(user, 'manage_users');
  const canAnnounce = isAdmin || window.hasPerm(user, 'manage_announcements');
  const [sub, setSub]           = useSt(canUsers ? 'users' : 'announce');
  const [settingTab, setSettingTab] = useSt('workboard'); // workboard | issues | samples
  const [users, setUsers]       = useSt([]);
  const [loading, setLoading]   = useSt(true);
  const [userModal, setUserModal] = useSt(false);
  const [editUser, setEditUser] = useSt(null);
  const [saving, setSaving]     = useSt(false);
  const [sortKey, setSortKey]   = useSt('name');   // name | email | role
  const [sortDir, setSortDir]   = useSt('asc');    // asc | desc

  // 工作看板設定
  const [wbEng,  setWbEng]  = useSt([]);
  const [wbMach, setWbMach] = useSt([]);
  // 異常與資源設定
  const [isEng,  setIsEng]  = useSt([]);
  const [isMach, setIsMach] = useSt([]);
  // 是否同步工作看板設定
  const [sync, setSync] = useSt(true);
  // 3D列印機預約設定
  const [bkSync,  setBkSync]  = useSt(true);
  const [bkEng,   setBkEng]   = useSt([]);
  const [bkMach,  setBkMach]  = useSt([]);
  const [bkSales, setBkSales] = useSt([]);
  const [bkCategories, setBkCategories] = useSt([]);   // 預約用途類別清單（「其他」固定保留，不列在此清單內）
  // 樣品借用人清單
  const [borrowers, setBorrowers] = useSt([]);
  // 角色分頁權限（可編輯的角色預設；儲存於 settings.role_presets）
  const DEF_ROLE_PRESETS = window.DEFAULT_ROLE_PRESETS || {};
  const [rolePresets, setRolePresets] = useSt(JSON.parse(JSON.stringify(DEF_ROLE_PRESETS)));
  // 地區設定（存於 settings.region_mode / settings.machine_regions）
  //   regionMode    分區功能對誰生效的總開關（off/alpha/beta/on），見 regions.js
  //   machineRegions 實體機台 alias → 區。這跟上面「機台清單」是兩種不同的東西：
  //     機台清單存的是機型（Form4/Form4L…，預約與工單用），這裡存的是 Formlabs/Eiger
  //     回報的實體機台代號（AluminumBowfin…，即時狀態卡與消耗紀錄用）
  const [regionMode, setRegionMode] = useSt('off');
  const [machineRegions, setMachineRegions] = useSt([]);   // [{alias, region}]

  const INP = {width:'100%',padding:'8px 11px',border:'1.5px solid var(--line)',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none',background:'var(--bg)',color:'var(--ink)'};
  const DEF_ENG  = K.ENG_ORDER.map(k=>({key:k,label:K.ENG_LABEL[k]||k}));
  const DEF_MACH = K.MACHINES.map(m=>({name:m}));
  const DEF_BORR = [{key:'Wang',label:'王小明'},{key:'Lee',label:'李美華'},{key:'Chang',label:'張大偉'},{key:'Chen',label:'陳怡君'},{key:'Lin',label:'林志豪'}];
  const DEF_SALES = [{key:'Amber',label:'安柏'},{key:'Charlie',label:'查理'}];
  const DEF_CATEGORIES = [{name:'活動展示'},{name:'工程測試'},{name:'代工'},{name:'評估'}];

  // 角色分級：管理員(admin) > 主管(有刪除權，但非 admin) > 工程師(有編輯權) > 查閱
  // 主管與工程師的差異在於「刪除」權（delete_board/delete_issues），單靠 edit_board 無法區分兩者
  const roleTierOf = u => {
    const p = u.permissions || [];
    if (p.includes('admin')) return 'admin';
    if (p.includes('delete_board') || p.includes('delete_issues')) return 'manager';
    if (p.includes('edit_board')) return 'operator';
    return 'viewer';
  };
  const ROLE_TIER_LABEL = { admin:'管理員', manager:'主管', operator:'工程師', viewer:'查閱' };
  const ROLE_TIER_RANK  = { admin:0, manager:1, operator:2, viewer:3 };
  // 使用者排序：依姓名/Email 字母（localeCompare）、依權限等級（管理員>主管>工程師>查閱）
  const roleRank = u => ROLE_TIER_RANK[roleTierOf(u)];
  const toggleSort = k => { if(sortKey===k) setSortDir(d=>d==='asc'?'desc':'asc'); else { setSortKey(k); setSortDir('asc'); } };
  const sortedUsers = [...users].sort((a,b)=>{
    let r = 0;
    if(sortKey==='name')       r = (a.displayName||'').localeCompare(b.displayName||'', 'zh-Hant');
    else if(sortKey==='email') r = (a.email||'').localeCompare(b.email||'');
    else if(sortKey==='role')  r = roleRank(a) - roleRank(b);
    // 地區排序：未設定的排最前面，方便 admin 一次補完（而不是散在清單各處）
    else if(sortKey==='region'){
      const rank = u => window.hasExplicitRegion && window.hasExplicitRegion(u)
        ? 1 + (window.REGIONS||[]).findIndex(x=>x.key===u.region) : 0;
      r = rank(a) - rank(b);
    }
    else if(sortKey==='status') r = (a.active===false?1:0) - (b.active===false?1:0); // 啟用在前
    return sortDir==='asc' ? r : -r;
  });

  const exportUsers = () => {
    if (!window.XLSX) { showToast('匯出元件尚未載入，請稍候重試','err'); return; }
    const rows = sortedUsers.map(u=>({
      '姓名': u.displayName||'',
      'Email': u.email||'',
      '權限': ROLE_TIER_LABEL[roleTierOf(u)],
      '地區': (window.hasExplicitRegion && window.hasExplicitRegion(u)) ? window.regionLabel(u.region) : '未設定',
      '個別權限清單': (u.permissions||[]).join(', '),
      '狀態': u.active?'啟用':'停用',
    }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length?rows:[{'姓名':''}]), '使用者清單');
    const today = new Date().toISOString().split('T')[0].replace(/-/g,'');
    XLSX.writeFile(wb, `使用者清單_${today}.xlsx`);
    showToast('已匯出 Excel ✓');
  };

  // 實體機台的地區歸屬：把 regions.js 的種子對照與已存設定合併成可編輯的陣列。
  // 種子提供「機台有哪些」的預設清單，已存設定覆蓋其區別；設定裡若有種子沒有的機台
  // （日後新增的機器）也一併帶出來，不要吃掉。
  const mergeMachineRegions = (saved) => {
    const seed = window.SEED_MACHINE_REGION || {};
    const out = Object.keys(seed).map(alias => ({ alias, region: seed[alias] }));
    if (saved && typeof saved === 'object') {
      Object.keys(saved).forEach(alias => {
        const hit = out.find(x => x.alias === alias);
        if (hit) hit.region = window.normRegion ? window.normRegion(saved[alias]) : saved[alias];
        else out.push({ alias, region: window.normRegion ? window.normRegion(saved[alias]) : saved[alias] });
      });
    }
    return out;
  };

  useEff(()=>{
    // 使用者清單改為即時訂閱（儲存後自動更新，免 F5）
    // ★ 只在有 manage_users 時才訂閱：firestore.rules 已把 users 讀取收緊成
    //   「自己 / admin / manage_users」，只有 manage_announcements 的人也進得來這個
    //   後台頁（canAdminPage 是兩者的聯集），無條件訂閱會被規則擋下並跳錯誤 toast。
    const unsubUsers = canUsers ? FBAuth.onUsersSnapshot(us => { setUsers(us); }) : null;
    (async()=>{
      const st = await FBSettings.get();
      if(st){
        setWbEng(st.engineers   || DEF_ENG);
        setWbMach(st.machines   || DEF_MACH);
        setIsEng(st.is_engineers || st.engineers || DEF_ENG);
        setIsMach(st.is_machines  || st.machines  || DEF_MACH);
        setSync(st.sync_issues !== false);
        const rawB = st.borrowers || DEF_BORR;
        setBorrowers(rawB.map(b => typeof b === 'string' ? {key:b, label:b} : b));
        // 3D列印機預約設定
        const bkS = st.bk_sync !== false;
        setBkSync(bkS);
        setBkEng(st.bk_engineers  || (bkS ? (st.engineers||DEF_ENG)  : DEF_ENG));
        setBkMach(st.bk_machines  || (bkS ? (st.machines||DEF_MACH)  : DEF_MACH));
        setBkSales(st.bk_sales || DEF_SALES);
        setBkCategories(st.bk_categories || DEF_CATEGORIES);
        // 角色分頁權限：合併原廠預設與已存設定
        setRolePresets({ ...JSON.parse(JSON.stringify(DEF_ROLE_PRESETS)), ...(st.role_presets||{}) });
        // 地區設定
        setRegionMode(st.region_mode || 'off');
        setMachineRegions(mergeMachineRegions(st.machine_regions));
      } else {
        setWbEng(DEF_ENG); setWbMach(DEF_MACH);
        setIsEng(DEF_ENG); setIsMach(DEF_MACH);
        setBorrowers(DEF_BORR);
        setBkEng(DEF_ENG); setBkMach(DEF_MACH); setBkSales(DEF_SALES); setBkCategories(DEF_CATEGORIES);
        setMachineRegions(mergeMachineRegions(null));
      }
      setLoading(false);
    })();
    return () => { if (unsubUsers) unsubUsers(); };
  },[]);

  // 保留 refreshUsers 介面（現在訂閱會自動更新，這裡僅作相容用）
  const refreshUsers = async()=>{ /* onSnapshot 自動更新，無需手動重讀 */ };

  // 同步開關：打開時把 issues 設定複製成 workboard 的值
  const toggleSync = (val) => {
    setSync(val);
    if(val){ setIsEng([...wbEng]); setIsMach([...wbMach]); }
  };
  // workboard 變動時如果 sync=true，同步更新 issues 和 booking（如果 bkSync）
  const setWbEngSync  = v => { setWbEng(v);  if(sync) setIsEng(v);   if(bkSync) setBkEng(v);  };
  const setWbMachSync = v => { setWbMach(v); if(sync) setIsMach(v);  if(bkSync) setBkMach(v); };

  const toggleBkSync = (val) => {
    setBkSync(val);
    if(val){ setBkEng([...wbEng]); setBkMach([...wbMach]); }
  };

  const saveSettings = async()=>{
    setSaving(true);
    const s = {
      engineers:    wbEng,
      machines:     wbMach,
      is_engineers: sync ? wbEng  : isEng,
      is_machines:  sync ? wbMach : isMach,
      sync_issues:  sync,
      borrowers,
      bk_sync:      bkSync,
      bk_engineers: bkSync ? wbEng  : bkEng,
      bk_machines:  bkSync ? wbMach : bkMach,
      bk_sales:     bkSales,
      bk_categories: bkCategories,
      role_presets: rolePresets,
    };
    // 地區設定只有 admin 能編（SETTING_TABS 已把分頁藏起來）。主管儲存時不要送出這兩個
    // 欄位——他們畫面上沒有這個分頁，state 是初始值，送出去會把 admin 設好的內容洗掉。
    if (isAdmin) {
      s.region_mode = regionMode;
      s.machine_regions = machineRegions.reduce((acc, m) => {
        if (m.alias && m.alias.trim()) acc[m.alias.trim()] = window.normRegion ? window.normRegion(m.region) : m.region;
        return acc;
      }, {});
    }
    // ★ 這裡原本沒有 try/catch：主管進得了這個分頁、按鈕也沒被 disabled，但 firestore.rules
    //   對 settings/{docId} 的 catch-all 規則只允許 isAdmin() 寫入。主管按下儲存會在
    //   FBSettings.save 拋出 permission-denied，之後所有程式碼（含 setSaving(false)）
    //   都不會執行，按鈕卡在「儲存中…」且沒有任何錯誤提示。
    try {
      await FBSettings.save(s);
      window.applySettings(s);
      // 通知樣品模組更新借用人清單
      try {
        if(window.smSetBorrowers)
          window.smSetBorrowers(borrowers.map(b=>typeof b==='string'?b:(b.label||b.key||b)));
      } catch(e){}
      showToast('設定已儲存 ✓');
    } catch(e) {
      showToast('儲存失敗：' + (e.message || e), 'err');
    } finally {
      setSaving(false);
    }
  };

  // regionField=true 時每一列多一個地區下拉（機台清單用）。
  // ★ 名稱欄原本寫 l[i]={name:...}，是「整個換掉」而不是合併，會把同一筆的其他欄位
  //   （現在的 region）默默吃掉——改名字就掉地區，而且不會有任何錯誤。改成展開合併。
  const ListEditor = ({label, list, setList, keyField=false, regionField=false}) => (
    <div style={{marginBottom:24}}>
      <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',marginBottom:10}}>{label}</div>
      {list.map((item,i)=>(
        <div key={i} style={{display:'flex',gap:8,marginBottom:7,alignItems:'center'}}>
          {keyField && <input style={{...INP,width:110}} placeholder="Key (英文)" value={item.key||''} onChange={ev=>{const l=[...list];l[i]={...l[i],key:ev.target.value};setList(l);}}/>}
          <input style={{...INP,flex:1}} placeholder={keyField?'顯示名稱':'名稱'} value={keyField?item.label||'':(item.name!==undefined?item.name:item)} onChange={ev=>{const l=[...list];l[i]=keyField?{...l[i],label:ev.target.value}:{...(typeof l[i]==='object'?l[i]:{}),name:ev.target.value};setList(l);}}/>
          {regionField && (
            <select style={{...INP,width:96}} value={(item&&item.region)||''} onChange={ev=>{const l=[...list];l[i]={...(typeof l[i]==='object'?l[i]:{name:l[i]}),region:ev.target.value||undefined};setList(l);}}>
              <option value="">全區</option>
              {(window.REGIONS||[]).map(r=><option key={r.key} value={r.key}>{r.label}</option>)}
            </select>
          )}
          <button className="kt-actbtn danger" title="刪除" onClick={()=>setList(list.filter((_,j)=>j!==i))}>✕</button>
        </div>
      ))}
      <button className="btn-cancel" style={{marginTop:2,fontSize:12}} onClick={()=>setList([...list, keyField?{key:'',label:''}:{name:''}])}>＋ 新增</button>
      {regionField && <div style={{fontSize:11,color:'var(--ink-4)',marginTop:6,lineHeight:1.6}}>
        地區留「全區」＝所有地區都看得到這個機型（例如共用的「Other」）。設定了地區的機型，分區啟用後只有該區的人看得到。
      </div>}
    </div>
  );

  const SalesEditor = () => (
    <div style={{marginBottom:24}}>
      <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',marginBottom:10}}>業務清單<span style={{fontWeight:400,color:'var(--ink-4)',fontSize:11,marginLeft:6}}>(獨立設定，不與工作看板同步)</span></div>
      <div style={{display:'grid',gridTemplateColumns:'110px 1fr 28px',gap:'0 8px',marginBottom:4}}>
        <div style={{fontSize:11,fontWeight:600,color:'var(--ink-4)',padding:'0 2px'}}>英文 / Key</div>
        <div style={{fontSize:11,fontWeight:600,color:'var(--ink-4)',padding:'0 2px'}}>中文名稱</div>
        <div/>
      </div>
      {bkSales.map((s,i)=>(
        <div key={i} style={{display:'grid',gridTemplateColumns:'110px 1fr 28px',gap:'0 8px',marginBottom:7,alignItems:'center'}}>
          <input style={{...INP,width:'100%'}} placeholder="Key (英文)" value={s.key||''} onChange={ev=>{const l=[...bkSales];l[i]={...l[i],key:ev.target.value};setBkSales(l);}}/>
          <input style={{...INP,width:'100%'}} placeholder="中文名稱" value={s.label||''} onChange={ev=>{const l=[...bkSales];l[i]={...l[i],label:ev.target.value};setBkSales(l);}}/>
          <button className="kt-actbtn danger" title="刪除" onClick={()=>setBkSales(bkSales.filter((_,j)=>j!==i))}>✕</button>
        </div>
      ))}
      <button className="btn-cancel" style={{marginTop:2,fontSize:12}} onClick={()=>setBkSales([...bkSales,{key:'',label:''}])}>＋ 新增業務</button>
    </div>
  );

  const BorrowerEditor = () => (
    <div style={{marginBottom:24}}>
      <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',marginBottom:10}}>借用人清單</div>
      <div style={{display:'grid',gridTemplateColumns:'110px 1fr 28px',gap:'0 8px',marginBottom:4}}>
        <div style={{fontSize:11,fontWeight:600,color:'var(--ink-4)',padding:'0 2px'}}>英文名 / Key</div>
        <div style={{fontSize:11,fontWeight:600,color:'var(--ink-4)',padding:'0 2px'}}>中文名稱</div>
        <div/>
      </div>
      {borrowers.map((b,i)=>(
        <div key={i} style={{display:'grid',gridTemplateColumns:'110px 1fr 28px',gap:'0 8px',marginBottom:7,alignItems:'center'}}>
          <input style={{...INP,width:'100%'}} placeholder="Key (英文)" value={b.key||''} onChange={ev=>{const l=[...borrowers];l[i]={...l[i],key:ev.target.value};setBorrowers(l);}}/>
          <input style={{...INP,width:'100%'}} placeholder="顯示名稱" value={b.label||''} onChange={ev=>{const l=[...borrowers];l[i]={...l[i],label:ev.target.value};setBorrowers(l);}}/>
          <button className="kt-actbtn danger" title="刪除" onClick={()=>setBorrowers(borrowers.filter((_,j)=>j!==i))}>✕</button>
        </div>
      ))}
      <button className="btn-cancel" style={{marginTop:2,fontSize:12}} onClick={()=>setBorrowers([...borrowers,{key:'',label:''}])}>＋ 新增借用人</button>
    </div>
  );

  if(loading) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:300,color:'var(--ink-4)',fontSize:14}}>⏳ 載入中...</div>;

  const SETTING_TABS = [
    {key:'workboard', label:'工作看板'},
    {key:'issues',    label:'異常與資源'},
    {key:'booking',   label:'機台預約'},
    {key:'samples',   label:'3D列印樣品'},
    // 地區設定僅開放 admin：它同時控制「分區功能對誰生效」與機台歸屬，屬於全系統層級的開關
    ...(isAdmin ? [{key:'regions', label:'地區'}] : []),
    ...(isAdmin ? [{key:'roles', label:'角色權限'}] : []),  // 角色權限僅開放 admin，主管不可見
  ];

  // 角色分頁權限：切換某角色的某權限
  const TAB_PERMS = window.TAB_PERMS || [];
  const PERMS_MAP = window.PERMS_MAP || {};
  const ROLE_LABELS = { manager:'主管 (manager)', operator:'工程師 (operator)', viewer:'查閱 (viewer)' };
  const EDITABLE_ROLES = ['manager','operator','viewer'];  // admin 固定全權，不開放編輯
  const toggleRolePerm = (role, perm) => setRolePresets(rp => {
    const cur = rp[role] || [];
    const next = cur.includes(perm) ? cur.filter(p=>p!==perm) : [...cur, perm];
    return { ...rp, [role]: next };
  });

  return (
    <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0}}>
      <div className="shell-top">
        <nav className="shell-tabs" role="tablist">
          {[
            ...(canUsers    ? [['users','👥 使用者'],['settings','⚙️ 設定']] : []),
            ...(canAnnounce ? [['announce','📢 公告欄']] : []),
          ].map(([k,l])=>(
            <button key={k} role="tab" aria-selected={sub===k} className="shell-tab" onClick={()=>setSub(k)}>{l}</button>
          ))}
        </nav>
        <div className="shell-spacer"/>
        <div className="shell-aux">ADMIN</div>
      </div>
      <div className="shell-body" style={{flex:1,minHeight:0,overflowY:'auto',padding:'20px 28px'}}>

        {/* ── 使用者管理 ── */}
        {sub==='users'&&(
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <h2 style={{fontSize:16,fontWeight:700}}>使用者管理</h2>
              <div style={{display:'flex',gap:8}}>
                <button className="btn-cancel" style={{padding:'0 12px',fontSize:12}} onClick={exportUsers} title="匯出使用者清單為 Excel">⬇ 匯出Excel</button>
                <button className="btn-add" onClick={()=>{setEditUser(null);setUserModal(true);}}>+ 新增使用者</button>
              </div>
            </div>
            <table className="u-tbl">
              <thead><tr>
                <th onClick={()=>toggleSort('name')} style={{cursor:'pointer',userSelect:'none'}}>使用者 <span style={{opacity:sortKey==='name'?.9:.3,fontSize:10}}>{sortKey==='name'?(sortDir==='asc'?'▲':'▼'):'↕'}</span></th>
                <th onClick={()=>toggleSort('email')} style={{cursor:'pointer',userSelect:'none'}}>Email <span style={{opacity:sortKey==='email'?.9:.3,fontSize:10}}>{sortKey==='email'?(sortDir==='asc'?'▲':'▼'):'↕'}</span></th>
                <th onClick={()=>toggleSort('role')} style={{cursor:'pointer',userSelect:'none'}}>權限 <span style={{opacity:sortKey==='role'?.9:.3,fontSize:10}}>{sortKey==='role'?(sortDir==='asc'?'▲':'▼'):'↕'}</span></th>
                <th onClick={()=>toggleSort('region')} style={{cursor:'pointer',userSelect:'none'}}>地區 <span style={{opacity:sortKey==='region'?.9:.3,fontSize:10}}>{sortKey==='region'?(sortDir==='asc'?'▲':'▼'):'↕'}</span></th>
                <th onClick={()=>toggleSort('status')} style={{cursor:'pointer',userSelect:'none'}}>狀態 <span style={{opacity:sortKey==='status'?.9:.3,fontSize:10}}>{sortKey==='status'?(sortDir==='asc'?'▲':'▼'):'↕'}</span></th><th>操作</th>
              </tr></thead>
              <tbody>
                {sortedUsers.map(u=>(
                  <tr key={u._id}>
                    <td><div style={{display:'flex',alignItems:'center',gap:10}}><div className="u-avatar">{(u.displayName||'?').slice(0,1)}</div>{u.displayName}</div></td>
                    <td style={{color:'var(--ink-3)',fontSize:12}}>{u.email}</td>
                    <td><span className={`role-chip ${roleTierOf(u)}`}>{ROLE_TIER_LABEL[roleTierOf(u)]}</span></td>
                    <td>{window.hasExplicitRegion && window.hasExplicitRegion(u)
                      ? <span style={{fontSize:12,color:'var(--ink-2)'}}>{window.regionLabel(u.region)}</span>
                      /* 未設定地區 → 標紅。分區上線後這些人會靜默地被當成中區，
                         不會報錯也不會有畫面壞掉，只能靠這裡讓 admin 一眼看到（決策 E 防呆之三）*/
                      : <span title="尚未設定地區：分區功能啟用後，此帳號會被視為中部"
                              style={{fontSize:11.5,fontWeight:600,color:'var(--danger)',background:'var(--danger-soft)',border:'1px solid var(--danger)',borderRadius:999,padding:'1px 8px'}}>未設定</span>}</td>
                    <td><span className={`st-dot${u.active?' on':' off'}`}>{u.active?'● 啟用':'● 停用'}</span></td>
                    <td><span className="kt-act">
                      {(isAdmin || !(u.permissions||[]).includes('admin')) &&
                        <button className="kt-actbtn" onClick={()=>{setEditUser(u);setUserModal(true);}}>✎</button>}
                      {isAdmin && <button className="kt-actbtn danger" onClick={async()=>{
                        if((u.permissions||[]).includes('admin') && users.filter(x=>(x.permissions||[]).includes('admin')).length<=1){
                          showToast('至少需保留一位管理員，無法刪除','err'); return;
                        }
                        if(!confirm('確定刪除？'))return;await FBAuth.deleteUser(u._id);await refreshUsers();showToast('已刪除','inf');}}>✕</button>}
                    </span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {/* ── 系統設定 ── */}
        {sub==='settings'&&(
          <div style={{maxWidth:680}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
              <h2 style={{fontSize:16,fontWeight:700}}>系統設定</h2>
              <button className="btn-save" style={{padding:'0 24px',height:36,opacity:saving?.5:1}} onClick={saveSettings} disabled={saving}>
                {saving?'儲存中…':'💾 儲存所有設定'}
              </button>
            </div>

            {/* 分頁切換 */}
            <div style={{display:'flex',gap:4,marginBottom:24,background:'var(--bg-soft)',padding:4,borderRadius:8,width:'fit-content'}}>
              {SETTING_TABS.map(t=>(
                <button key={t.key} onClick={()=>setSettingTab(t.key)} style={{padding:'6px 18px',borderRadius:6,border:'none',fontSize:13,fontWeight:600,cursor:'pointer',transition:'all .15s',background:settingTab===t.key?'var(--bg)':'transparent',color:settingTab===t.key?'var(--ink)':'var(--ink-3)',boxShadow:settingTab===t.key?'0 1px 3px rgba(0,0,0,.1)':'none',fontFamily:'inherit'}}>
                  {t.label}
                </button>
              ))}
            </div>

            {/* 工作看板設定 */}
            {settingTab==='workboard'&&(
              <div>
                {ListEditor({label:"工程師清單", list:wbEng,  setList:setWbEngSync,  keyField:true})}
                {ListEditor({label:"機台清單",   list:wbMach, setList:setWbMachSync, keyField:false, regionField:true})}
              </div>
            )}

            {/* 異常與資源設定 */}
            {settingTab==='issues'&&(
              <div>
                {/* 同步開關 */}
                <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',background:sync?'var(--ok-soft)':'var(--bg-soft)',border:'1.5px solid',borderColor:sync?'#9acfb4':'var(--line)',borderRadius:8,marginBottom:20,cursor:'pointer'}} onClick={()=>toggleSync(!sync)}>
                  <div style={{width:36,height:20,background:sync?'var(--ok)':'#cbd0d8',borderRadius:10,position:'relative',transition:'background .2s',flexShrink:0}}>
                    <div style={{position:'absolute',top:2,left:sync?18:2,width:16,height:16,background:'#fff',borderRadius:'50%',transition:'left .2s',boxShadow:'0 1px 3px rgba(0,0,0,.2)'}}/>
                  </div>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:sync?'var(--ok)':'var(--ink-2)'}}>
                      {sync?'✅ 與工作看板同步':'使用個別設定'}
                    </div>
                    <div style={{fontSize:11,color:'var(--ink-4)',marginTop:2}}>
                      {sync?'工程師與機台清單與工作看板相同，修改請至「工作看板」頁籤':'異常與資源使用獨立的工程師與機台清單'}
                    </div>
                  </div>
                </div>
                {sync
                  ? <div style={{padding:'16px',background:'var(--bg-soft)',border:'1px solid var(--line)',borderRadius:8,color:'var(--ink-4)',fontSize:13,textAlign:'center'}}>目前同步工作看板設定，如需個別設定請關閉同步</div>
                  : <>
                      {ListEditor({label:"工程師清單（獨立）", list:isEng,  setList:setIsEng,  keyField:true})}
                      {ListEditor({label:"機台清單（獨立）",   list:isMach, setList:setIsMach, keyField:false, regionField:true})}
                    </>
                }
              </div>
            )}

            {/* 3D列印樣品設定 */}
            {settingTab==='samples'&&(
              <div>
                {BorrowerEditor()}
                <div style={{padding:'12px 14px',background:'var(--accent-soft)',border:'1px solid #b5d4f4',borderRadius:8,fontSize:12,color:'var(--accent)'}}>
                  💡 借用人清單會在儲存後即時更新至樣品管理頁面
                </div>
              </div>
            )}

            {/* 3D列印機預約設定 */}
            {settingTab==='booking'&&(
              <div>
                {/* 工程師/機台同步開關 */}
                <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',background:bkSync?'var(--ok-soft)':'var(--bg-soft)',border:'1.5px solid',borderColor:bkSync?'#9acfb4':'var(--line)',borderRadius:8,marginBottom:20,cursor:'pointer'}} onClick={()=>toggleBkSync(!bkSync)}>
                  <div style={{width:36,height:20,background:bkSync?'var(--ok)':'#cbd0d8',borderRadius:10,position:'relative',transition:'background .2s',flexShrink:0}}>
                    <div style={{position:'absolute',top:2,left:bkSync?18:2,width:16,height:16,background:'#fff',borderRadius:'50%',transition:'left .2s',boxShadow:'0 1px 3px rgba(0,0,0,.2)'}}/>
                  </div>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:bkSync?'var(--ok)':'var(--ink-2)'}}>
                      {bkSync?'✅ 工程師與機台已與工作看板同步':'工程師與機台使用個別設定'}
                    </div>
                    <div style={{fontSize:11,color:'var(--ink-4)',marginTop:2}}>
                      {bkSync?'工程師與機台清單與工作看板相同，修改請至「工作看板」頁籤':'3D列印機預約使用獨立的工程師與機台清單'}
                    </div>
                  </div>
                </div>
                {bkSync
                  ? <div style={{padding:'16px',background:'var(--bg-soft)',border:'1px solid var(--line)',borderRadius:8,color:'var(--ink-4)',fontSize:13,textAlign:'center',marginBottom:20}}>工程師與機台目前同步工作看板設定，如需個別設定請關閉同步</div>
                  : <>
                      {ListEditor({label:"工程師清單（獨立）", list:bkEng,  setList:setBkEng,  keyField:true})}
                      {ListEditor({label:"機台清單（獨立）",   list:bkMach, setList:setBkMach, keyField:false, regionField:true})}
                    </>
                }
                {/* 業務清單（獨立，含中英文） */}
                {SalesEditor()}
                {ListEditor({label:"用途類別清單", list:bkCategories, setList:setBkCategories, keyField:false})}
                <div style={{fontSize:11,color:'var(--ink-4)',marginTop:-16,marginBottom:20}}>「其他」選項固定保留（選擇後可自行輸入說明），不需列在此清單中</div>
              </div>
            )}

            {/* 地區設定（admin 專屬）*/}
            {settingTab==='regions'&&isAdmin&&(
              <div>
                <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',marginBottom:10}}>分區功能啟用範圍</div>
                <div style={{fontSize:12,color:'var(--ink-4)',lineHeight:1.75,marginBottom:12}}>
                  分階段開放，確認沒問題再往下一級。<b style={{color:'var(--ink-2)'}}>切換立即生效、不需重新部署</b>，
                  出狀況改回「關閉」即可還原。
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:7,marginBottom:10}}>
                  {[
                    ['off',   '關閉',  '所有人維持現況，看不到任何分區差異（預設）'],
                    ['alpha', 'Alpha', '只有管理員套用分區顯示，其他同事完全無感'],
                    ['beta',  'Beta',  '管理員 + 主管，供各區主管試用回報'],
                    ['on',    '正式',  '所有人套用分區顯示'],
                  ].map(([v,label,desc])=>(
                    <label key={v} style={{display:'flex',alignItems:'flex-start',gap:9,padding:'9px 12px',border:'1.5px solid',borderColor:regionMode===v?'var(--accent)':'var(--line)',background:regionMode===v?'var(--accent-soft)':'var(--bg)',borderRadius:7,cursor:'pointer'}}>
                      <input type="radio" name="regionMode" checked={regionMode===v} onChange={()=>setRegionMode(v)} style={{marginTop:2}}/>
                      <span>
                        <span style={{fontSize:13,fontWeight:600,color:regionMode===v?'var(--accent)':'var(--ink-2)'}}>{label}</span>
                        <span style={{display:'block',fontSize:11.5,color:'var(--ink-4)',marginTop:2}}>{desc}</span>
                      </span>
                    </label>
                  ))}
                </div>
                <div style={{padding:'10px 12px',background:'var(--warn-soft)',border:'1px solid var(--warn-border)',borderRadius:7,fontSize:11.5,color:'var(--warn)',lineHeight:1.7,marginBottom:26}}>
                  ⚠ 這個開關只控制「畫面顯示」。資料層的隔離（Firestore 安全規則）是另一階段的事，
                  一旦收緊就對所有人生效、不受此開關影響。
                </div>

                <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',marginBottom:6}}>列印機地區歸屬</div>
                <div style={{fontSize:12,color:'var(--ink-4)',lineHeight:1.75,marginBottom:12}}>
                  這裡設定的是 <b style={{color:'var(--ink-2)'}}>Formlabs / Eiger 回報的實體機台</b>（即時狀態卡、消耗紀錄用），
                  與上面各分頁的「機台清單」不同 —— 那裡存的是機型名稱（Form4、Form4L…），預約與工單用。
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 110px 28px',gap:'0 8px',marginBottom:4}}>
                  <div style={{fontSize:11,fontWeight:600,color:'var(--ink-4)',padding:'0 2px'}}>機台代號</div>
                  <div style={{fontSize:11,fontWeight:600,color:'var(--ink-4)',padding:'0 2px'}}>地區</div>
                  <div/>
                </div>
                {machineRegions.map((m,i)=>(
                  <div key={i} style={{display:'grid',gridTemplateColumns:'1fr 110px 28px',gap:'0 8px',marginBottom:7,alignItems:'center'}}>
                    <input style={{...INP,width:'100%'}} placeholder="例：AluminumBowfin" value={m.alias||''}
                      onChange={ev=>{const l=[...machineRegions];l[i]={...l[i],alias:ev.target.value};setMachineRegions(l);}}/>
                    <select style={{...INP,width:'100%'}} value={m.region||'central'}
                      onChange={ev=>{const l=[...machineRegions];l[i]={...l[i],region:ev.target.value};setMachineRegions(l);}}>
                      {(window.REGIONS||[]).map(r=><option key={r.key} value={r.key}>{r.label}</option>)}
                    </select>
                    <button className="kt-actbtn danger" title="刪除" onClick={()=>setMachineRegions(machineRegions.filter((_,j)=>j!==i))}>✕</button>
                  </div>
                ))}
                <button className="btn-cancel" style={{marginTop:2,fontSize:12}} onClick={()=>setMachineRegions([...machineRegions,{alias:'',region:'central'}])}>＋ 新增機台</button>
                <div style={{fontSize:11,color:'var(--ink-4)',marginTop:8,lineHeight:1.7}}>
                  機台代號可填完整 serial 或代號片段，系統以「包含」比對（Formlabs 有時回報 <code>Form4-AluminumBowfin</code>、有時只回 <code>AluminumBowfin</code>）。
                  沒列在這裡的機台一律歸中部。
                </div>
              </div>
            )}

            {/* 角色分頁權限設定（admin 專屬） */}
            {settingTab==='roles'&&isAdmin&&(
              <div>
                <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',marginBottom:6}}>角色分頁權限設定</div>
                <div style={{fontSize:12,color:'var(--ink-4)',marginBottom:16,lineHeight:1.7}}>
                  設定各角色「快速套用」時的預設權限（含分頁可見範圍）。管理員固定擁有所有權限，不可調整。<br/>
                  個別使用者仍可在「使用者」分頁單獨微調權限（覆蓋角色預設）。
                </div>
                <div style={{overflowX:'auto',border:'1px solid var(--line)',borderRadius:8}}>
                  <table className="u-tbl" style={{minWidth:520}}>
                    <thead><tr>
                      <th style={{textAlign:'left'}}>權限 / 角色</th>
                      {EDITABLE_ROLES.map(r=><th key={r} style={{textAlign:'center',whiteSpace:'nowrap'}}>{ROLE_LABELS[r]}</th>)}
                    </tr></thead>
                    <tbody>
                      {Object.entries(PERMS_MAP).filter(([p])=>p!=='admin').map(([perm,label])=>(
                        <tr key={perm}>
                          <td style={{fontSize:12}}>{label}<span style={{color:'#b0b6bf',fontFamily:'monospace',marginLeft:6,fontSize:10.5}}>{perm}</span></td>
                          {EDITABLE_ROLES.map(role=>(
                            <td key={role} style={{textAlign:'center'}}>
                              <input type="checkbox" checked={(rolePresets[role]||[]).includes(perm)} onChange={()=>toggleRolePerm(role,perm)} style={{width:16,height:16,cursor:'pointer'}}/>
                            </td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{marginTop:14,padding:'12px 14px',background:'var(--warn-soft)',border:'1px solid #e8d9a8',borderRadius:8,fontSize:12,color:'var(--warn)',lineHeight:1.7}}>
                  ⚠ 儲存後：套用該角色的使用者需重新載入頁面才會生效；已個別調整權限的使用者不受影響。
                  <button className="btn-cancel" style={{marginLeft:12,fontSize:11,padding:'2px 10px'}}
                    onClick={()=>setRolePresets(JSON.parse(JSON.stringify(DEF_ROLE_PRESETS)))}>還原原廠預設</button>
                </div>
              </div>
            )}
          </div>
        )}

        {/* ── 公告欄 ── */}
        {sub==='announce' && canAnnounce && <AnnouncementAdmin user={user}/>}
      </div>
      {userModal&&<UserModal item={editUser} onClose={()=>setUserModal(false)} onSaved={refreshUsers} callerIsAdmin={isAdmin}
        otherAdmins={users.filter(x=>x._id!==(editUser&&editUser._id) && (x.permissions||[]).includes('admin')).length}/>}
    </div>
  );
}

function ChangePasswordModal({ onClose }) {
  const [cur, setCur] = React.useState('');
  const [nw, setNw] = React.useState('');
  const [cf, setCf] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const submit = async () => {
    if (!cur || !nw) { window.showToast('請填寫目前密碼與新密碼','err'); return; }
    if (nw.length < 6) { window.showToast('新密碼至少 6 碼','err'); return; }
    if (nw !== cf) { window.showToast('兩次新密碼不一致','err'); return; }
    setBusy(true);
    try {
      await window.FBAuth.changePassword(cur, nw);
      window.showToast('密碼已更新','ok');
      onClose();
    } catch(e) {
      const map = {
        'auth/wrong-password':'目前密碼錯誤',
        'auth/weak-password':'新密碼太弱（至少 6 碼）',
        'auth/requires-recent-login':'請重新登入後再變更密碼',
        'auth/too-many-requests':'嘗試次數過多，請稍後再試',
      };
      window.showToast(map[e.code] || e.message || '變更失敗','err');
    } finally { setBusy(false); }
  };
  const S_INP = {width:'100%',padding:'8px 10px',border:'1px solid var(--line)',borderRadius:6,fontSize:13,fontFamily:'inherit',marginTop:4,boxSizing:'border-box',background:'var(--bg)',color:'var(--ink)'};
  const LBL = {fontSize:12,color:'var(--ink-3)',fontWeight:600};
  return (
    <div className="m-overlay">
      <div className="m-box" style={{maxWidth:400}}>
        <div className="m-hd"><h3>🔑 變更密碼</h3><button className="m-close" onClick={onClose}>×</button></div>
        <div className="m-body">
          <div className="m-field"><label style={LBL}>目前密碼</label><input style={S_INP} type="password" value={cur} onChange={e=>setCur(e.target.value)}/></div>
          <div className="m-field"><label style={LBL}>新密碼（至少 6 碼）</label><input style={S_INP} type="password" value={nw} onChange={e=>setNw(e.target.value)}/></div>
          <div className="m-field"><label style={LBL}>確認新密碼</label><input style={S_INP} type="password" value={cf} onChange={e=>setCf(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}/></div>
        </div>
        <div className="m-foot">
          <button className="btn-cancel" onClick={onClose}>取消</button>
          <button className="btn-save" onClick={submit} disabled={busy}>{busy?'更新中…':'更新密碼'}</button>
        </div>
      </div>
    </div>
  );
}

/* Root App */
function App() {
  const [user, setUser] = useStateApp(null);
  const [checking, setChecking] = useStateApp(true);

  useEffectApp(() => {
    let unsubUserDoc  = null;
    let unsubSettings = null;
    let unsubInv      = null;
    const teardownSession = () => {
      if (unsubUserDoc)  { unsubUserDoc();  unsubUserDoc  = null; }
      if (unsubSettings) { unsubSettings(); unsubSettings = null; }
      if (unsubInv)      { unsubInv();      unsubInv      = null; }
    };
    // 監聽登入狀態
    const unsubAuth = FBAuth.onStateChanged(async fbUser => {
      teardownSession();
      if (fbUser) {
        const u = await FBAuth.getUser(fbUser.uid);
        if (u && u.active) {
          setUser(u);
          // ★ settings/inventory 訂閱必須等確認登入成功才建立，不能在 App 掛載時就註冊：
          //   未登入時訂閱會被 Firestore rules 擋下 permission-denied，而 onSnapshot
          //   收到 permission-denied 後不會自動重試/重新訂閱——即使之後登入成功，這個
          //   監聽器也已經死了。結果整個 session 都讀不到即時工程師/機台清單，下拉選單
          //   全部掉回寫死的 K.ENG_ORDER。只有 admin 因為進後台按過「儲存」，靠本機立即
          //   套用（saveSettings 內的 window.applySettings）才看起來正常，其餘角色都受影響。
          unsubSettings = FBSettings.onSnapshot(s => { if (s) window.applySettings(s); });
          // 監聽材料庫存 → 工作看板「樹脂材料」下拉用（與材料庫存頁一致）
          unsubInv = FBInventory.onSnapshot(names => {
            window._inventory_materials = names;
            if (window._onSettingsUpdated) window._onSettingsUpdated();
          });
          // 即時訂閱自己的使用者文件：權限被改時左下角會即時更新，停用時自動登出
          unsubUserDoc = FBAuth.onUserSnapshot(fbUser.uid, async (fresh) => {
            if (!fresh || !fresh.active) {
              await FBAuth.signOut();
              setUser(null);
            } else {
              setUser(fresh);
            }
          });
        }
        else { await FBAuth.signOut(); setUser(null); }
      } else { setUser(null); }
      setChecking(false);
    });
    return () => { unsubAuth(); teardownSession(); };
  }, []);

  if (checking) return (
    <div style={{position:'fixed',inset:0,background:'linear-gradient(135deg,var(--ink),#131c2e)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:14,fontFamily:'JetBrains Mono,monospace'}}>
      載入中...
    </div>
  );

  if (!user) return <LoginPage onLogin={setUser}/>;
  return <Shell user={user} onLogout={async()=>{ await FBAuth.signOut(); setUser(null); }}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
