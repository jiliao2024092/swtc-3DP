<script type="text/babel" data-presets="react">
const { useState: useStateK, useMemo: useMemoK } = React;

function KanbanView({ data, setData }) {
  const K = window.K;
  const [search, setSearch] = useStateK('');
  const [engF, setEngF] = useStateK('');
  const [machF, setMachF] = useStateK('');
  const [groupBy, setGroupBy] = useStateK('status');
  const [density, setDensity] = useStateK('comfortable');
  const [hideDone, setHideDone] = useStateK(true);
  const [open, setOpen] = useStateK(null);
  const [dragItem, setDragItem] = useStateK(null);

  const STATUS_COLUMNS = [
    { key:'todo',     title:'待開始',  hint:'0%, 尚未排程',    tone:'var(--ink-3)' },
    { key:'blocked',  title:'等待材料', hint:'需調撥 / 待客戶', tone:'var(--warn)' },
    { key:'progress', title:'進行中',  hint:'已排程, 列印中',  tone:'var(--accent)' },
    { key:'done',     title:'已完成',  hint:'100% / 出貨',     tone:'var(--ok)' },
    { key:'cancelled',title:'已取消',  hint:'備註含「取消」',  tone:'#9aa3b2' },
  ];
  const PROGRESS_COLUMNS = [
    { key:'0',   title:'0%',   hint:'尚未開始', tone:'#9aa3b2' },
    { key:'25',  title:'25%',  hint:'備料/起印', tone:'var(--warn)' },
    { key:'50',  title:'50%',  hint:'列印中',    tone:'var(--warn)' },
    { key:'75',  title:'75%',  hint:'後處理',    tone:'var(--accent)' },
    { key:'100', title:'100%', hint:'完成',       tone:'var(--ok)' },
  ];
  const ENGINEER_COLUMNS = K.ENG_ORDER.map(k => ({ key:k, title:K.ENG_LABEL[k], hint:k, tone:K.ENG_TONE[k].fg }));
  const MACHINE_COLUMNS  = K.MACHINES.map(k => ({ key:k, title:k, hint:'機台', tone:'var(--accent)' }));
  const RESIN_LIST       = (window._inventory_materials && window._inventory_materials.length) ? window._inventory_materials : K.RESINS;
  const RESIN_COLUMNS    = [...RESIN_LIST.map(k => ({ key:k, title:k, hint:'樹脂', tone:'var(--purple)' })), { key:'未分類', title:'未分類', hint:'未指定樹脂', tone:'#9aa3b2' }];
  const CATEGORY_COLUMNS = [...K.CATEGORIES.map(k => ({ key:k, title:k, hint:'類型', tone:'var(--accent)' })), { key:'未分類', title:'未分類', hint:'未指定類型', tone:'#9aa3b2' }];

  const cols = groupBy==='status' ? STATUS_COLUMNS : groupBy==='progress' ? PROGRESS_COLUMNS : groupBy==='engineer' ? ENGINEER_COLUMNS : groupBy==='machine' ? MACHINE_COLUMNS : groupBy==='resin' ? RESIN_COLUMNS : CATEGORY_COLUMNS;

  function columnKeyFor(item) {
    if (groupBy==='status')   return K.statusOf(item);
    if (groupBy==='progress') return String(item.progress);
    if (groupBy==='engineer') return item.engineer;
    if (groupBy==='machine')  return item.machine||'—';
    if (groupBy==='resin')    return item.resin||'未分類';
    if (groupBy==='category') return item.category||'未分類';
    return K.statusOf(item);
  }

  const filtered = useMemoK(() => {
    let r = K.applyFilters(data, { search, engineer:engF, machine:machF });
    if (hideDone) r = r.filter(d => { const s=K.statusOf(d); return s!=='done' && s!=='cancelled'; });
    return r;
  }, [data, search, engF, machF, hideDone]);
  const grouped  = useMemoK(() => {
    const m = {}; cols.forEach(c => { m[c.key] = []; });
    filtered.forEach(it => { const k = columnKeyFor(it); if (m[k]) m[k].push(it); });
    return m;
  }, [filtered, cols, groupBy]);

  const stats = {
    total:   data.length,
    wip:     data.filter(d=>K.statusOf(d)==='progress').length,
    blocked: data.filter(d=>K.statusOf(d)==='blocked').length,
    due7:    data.filter(d=>{ const s=K.statusOf(d); if(s==='done'||s==='cancelled')return false; const du=K.daysUntil(d.dueDate); return du!==null&&du<=7; }).length,
    done:    data.filter(d=>K.statusOf(d)==='done').length,
  };

  function handleDrop(colKey) {
    if (!dragItem) return;
    setData(prev => prev.map(d => {
      if (d.seq !== dragItem.seq) return d;
      const u = {...d};
      if (groupBy==='status') {
        if      (colKey==='done')     { u.progress=100; u.complete='是'; u.remark=(u.remark||'').replace('已取消','').trim(); }
        else if (colKey==='todo')     { u.progress=0;   u.complete='否'; u.remark=(u.remark||'').replace('已取消','').trim(); }
        else if (colKey==='progress') { if(u.progress===0||u.progress===100)u.progress=50; u.complete='否'; u.remark=(u.remark||'').replace('已取消','').trim(); }
        else if (colKey==='blocked')  { u.material='需調撥'; u.complete='否'; }
        else if (colKey==='cancelled'){ u.remark=u.remark?`${u.remark} · 已取消`:'已取消'; }
      } else if (groupBy==='progress') { u.progress=parseInt(colKey,10); u.complete=u.progress===100?'是':'否'; }
      else if (groupBy==='engineer') { u.engineer=colKey; }
      else if (groupBy==='machine')  { u.machine=colKey; }
      else if (groupBy==='resin')    { if(colKey!=='未分類') u.resin=colKey; }
      else if (groupBy==='category') { if(colKey!=='未分類') u.category=colKey; }
      return u;
    }));
    setDragItem(null);
  }

  function Avatar({ engineer }) {
    const tone = K.ENG_TONE[engineer]||{fg:'var(--ink-3)',bg:'var(--line-soft)'};
    return <span className="avatar" style={{color:tone.fg,background:tone.bg}} title={K.ENG_FULLLABEL[engineer]||K.ENG_LABEL[engineer]||engineer}>{K.ENG_INIT[engineer]||engineer.slice(0,2)}</span>;
  }

  function DueChip({ dateStr, isDone }) {
    if (!dateStr) return <span className="chip chip-muted">未訂期</span>;
    const d = K.daysUntil(dateStr);
    if (isDone) return <span className="chip chip-muted">{dateStr.slice(5)}</span>;
    let cls='chip', label=dateStr.slice(5);
    if      (d<0)  { cls+=' chip-red';   label=`逾期 ${-d}d`; }
    else if (d<=3) { cls+=' chip-red';   label=`${dateStr.slice(5)} · ${d}d`; }
    else if (d<=7) { cls+=' chip-amber'; label=`${dateStr.slice(5)} · ${d}d`; }
    else           { cls+=' chip-muted'; label=`${dateStr.slice(5)} · ${d}d`; }
    return <span className={cls}>{label}</span>;
  }

  function Card({ item }) {
    const st = K.statusOf(item);
    const done = st==='done', cancelled = st==='cancelled';
    return (
      <div className={`card${density==='compact'?' card-compact':''}${dragItem&&dragItem.seq===item.seq?' card-dragging':''}${cancelled?' card-cancelled':''}`}
        draggable onDragStart={()=>setDragItem(item)} onDragEnd={()=>setDragItem(null)} onClick={()=>setOpen(item)}>
        <div className="card-top">
          <span className="card-id">EF · {item.id ? item.id.slice(-7) : '—'}</span>
          <div className="card-top-right">
            {item.material==='需調撥'&&<span className="dot dot-amber"/>}
            <Avatar engineer={item.engineer}/>
          </div>
        </div>
        <div className="card-title">{item.customer}</div>
        {density!=='compact'&&(
          <div className="card-meta">
            <span className="meta-machine">{item.machine||'未指派機台'}</span>
            {item.remark&&<span className="meta-remark" title={item.remark}>· {item.remark}</span>}
          </div>
        )}
        <div className="card-progress">
          <div className="progress-track"><div className="progress-fill" style={{width:`${item.progress}%`,background:done?'var(--ok)':cancelled?'#cbd0d8':'var(--accent)'}}/></div>
          <span className="progress-num">{item.progress}%</span>
        </div>
        <div className="card-foot">
          <DueChip dateStr={item.dueDate} isDone={done}/>
          <span className="seq-num">#{String(item.seq).padStart(3,'0')}</span>
        </div>
      </div>
    );
  }

  function Column({ col, items }) {
    const [over, setOver] = useStateK(false);
    return (
      <div className={`col${over?' col-over':''}`}
        onDragOver={e=>{e.preventDefault();setOver(true);}}
        onDragLeave={()=>setOver(false)}
        onDrop={()=>{setOver(false);handleDrop(col.key);}}>
        <div className="col-head">
          <div className="col-head-left">
            <span className="col-dot" style={{background:col.tone}}/>
            <span className="col-title">{col.title}</span>
            <span className="col-count">{items.length}</span>
          </div>
          <span className="col-hint">{col.hint}</span>
        </div>
        <div className="col-body">
          {items.map(it=><Card key={it.seq} item={it}/>)}
          {items.length===0&&<div className="col-empty">—</div>}
        </div>
      </div>
    );
  }

  function Drawer() {
    if (!open) return null;
    const tone = K.ENG_TONE[open.engineer]||{fg:'var(--ink-3)',bg:'var(--line-soft)'};
    return (
      <div className="drawer-wrap" onClick={()=>setOpen(null)}>
        <aside className="drawer" onClick={e=>e.stopPropagation()}>
          <header className="drawer-head">
            <div>
              <div className="drawer-eyebrow">EF 訂單詳情</div>
              <div className="drawer-id">{open.id||'—'}</div>
            </div>
            <button className="icon-btn" onClick={()=>setOpen(null)}>×</button>
          </header>
          <div className="drawer-customer">{open.customer}</div>
          <div className="drawer-row">
            <div className="drawer-field">
              <div className="field-label">執行工程師</div>
              <div className="field-value">
                <span className="avatar" style={{color:tone.fg,background:tone.bg,marginRight:8}}>{K.ENG_INIT[open.engineer]||open.engineer.slice(0,2)}</span>
                {K.ENG_FULLLABEL[open.engineer]||K.ENG_LABEL[open.engineer]||open.engineer}
              </div>
            </div>
            <div className="drawer-field">
              <div className="field-label">機台</div>
              <div className="field-value mono">{open.machine||'—'}</div>
            </div>
          </div>
          <div className="drawer-row">
            <div className="drawer-field">
              <div className="field-label">期望交期</div>
              <div className="field-value mono">{open.dueDate||'—'}</div>
            </div>
            <div className="drawer-field">
              <div className="field-label">材料庫存</div>
              <div className="field-value">
                <span className={open.material==='足夠'?'pill pill-ok':'pill pill-amber'}>{open.material}</span>
              </div>
            </div>
          </div>
          <div className="drawer-row">
            <div className="drawer-field">
              <div className="field-label">開始日</div>
              <div className="field-value mono">{open.startDate||'—'}</div>
            </div>
            <div className="drawer-field">
              <div className="field-label">預計完成日</div>
              <div className="field-value mono">{open.endDate||'—'}</div>
            </div>
          </div>
          <div style={{marginBottom:16}}>
            <div className="field-label">進度</div>
            <div className="card-progress" style={{marginTop:8}}>
              <div className="progress-track" style={{height:6}}>
                <div className="progress-fill" style={{width:`${open.progress}%`}}/>
              </div>
              <span className="progress-num">{open.progress}%</span>
            </div>
          </div>
          {open.remark&&(
            <div>
              <div className="field-label">備註</div>
              <div className="remark-box" style={{marginTop:6}}>{open.remark}</div>
            </div>
          )}
          <div className="drawer-foot">
            <span>#{String(open.seq).padStart(3,'0')}</span>
            <span>{open.complete==='是'?'✅ 已完成':'未完成'}</span>
          </div>
        </aside>
      </div>
    );
  }

  const engineers = window._settings_engineers||K.ENG_ORDER;
  const machines  = window._settings_machines||K.MACHINES;

  return (
    <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0}}>
      <div className="kpi-strip">
        {[
          {label:'總訂單',   value:stats.total},
          {label:'進行中',   value:stats.wip},
          {label:'等待材料', value:stats.blocked},
          {label:'7天內到期',value:stats.due7},
          {label:'已完成',   value:stats.done},
        ].map(k=>(
          <div key={k.label} className="kpi-cell">
            <div className="kpi-label">{k.label}</div>
            <div className="kpi-value">{k.value}</div>
          </div>
        ))}
      </div>
      <div className="toolbar">
        <div className="t-search">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.5"/><path d="M11 11l3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜尋 EF / 客戶"/>
        </div>
        <select className="t-sel" value={engF} onChange={e=>setEngF(e.target.value)}>
          <option value="">所有工程師</option>
          {engineers.map(k=><option key={k} value={k}>{K.ENG_FULLLABEL[k]||K.ENG_LABEL[k]||k}</option>)}
        </select>
        <select className="t-sel" value={machF} onChange={e=>setMachF(e.target.value)}>
          <option value="">所有機台</option>
          {machines.map(m=><option key={m} value={m}>{m}</option>)}
        </select>
        <button
          onClick={()=>setHideDone(v=>!v)}
          style={{height:30,padding:'0 13px',border:'1px solid var(--line)',borderRadius:999,background:hideDone?'var(--bg-soft)':'var(--accent-soft)',color:hideDone?'var(--ink-3)':'var(--accent)',fontSize:12,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:5,whiteSpace:'nowrap',flexShrink:0,fontWeight:hideDone?400:600,transition:'all 0.12s',fontFamily:'inherit'}}>
          {hideDone ? '顯示已完成／已取消' : '👁 顯示已完成／已取消'}
        </button>
        <div className="seg">
          {[['status','狀態'],['progress','進度'],['engineer','工程師'],['machine','機台'],['resin','樹脂'],['category','類型']].map(([g,l])=>(
            <button key={g} className={`seg-btn${groupBy===g?' active':''}`} onClick={()=>setGroupBy(g)}>{l}</button>
          ))}
        </div>
        <div className="seg">
          {[['comfortable','標準'],['compact','緊湊']].map(([d,l])=>(
            <button key={d} className={`seg-btn${density===d?' active':''}`} onClick={()=>setDensity(d)}>{l}</button>
          ))}
        </div>
      </div>
      <div className="board">
        {cols.map(col=><Column key={col.key} col={col} items={grouped[col.key]||[]}/>)}
      </div>
      <Drawer/>
    </div>
  );
}
window.KanbanView = KanbanView;
</script>

<!-- ③ GanttView -->
<script type="text/babel" data-presets="react">
function GanttView({ data }) {
  const K = window.K;
  const { useState: useStateG, useMemo: useMemoG, useRef: useRefG, useEffect: useEffectG } = React;
  const [engF, setEngF] = useStateG('');
  const [statusF, setStatusF] = useStateG('');
  const [showDone, setShowDone] = useStateG(false);
  const [tooltip, setTooltip] = useStateG(null); // { item, x, y }
  const ganttRef = useRefG(null);
  const filtered = useMemoG(() => {
    let d = data;
    if (!showDone) d = d.filter(x => K.statusOf(x) !== 'done');
    if (engF) d = d.filter(x => x.engineer === engF);
    if (statusF) d = d.filter(x => K.statusOf(x) === statusF);
    return d;
  }, [data, engF, statusF, showDone]);
  const today = K.TODAY;
  const DAY = K.DAY;
  const DAY_W = 22;

  const { startD, days } = useMemoG(() => {
    const all = [];
    filtered.forEach(d => {
      if (d.startDate) all.push(new Date(d.startDate));
      if (d.endDate)   all.push(new Date(d.endDate));
      if (d.dueDate)   all.push(new Date(d.dueDate));
    });
    all.push(today);
    if (!all.length) return { startD: today, days: 60 };
    const min = new Date(Math.min(...all.map(d=>d.getTime())));
    const max = new Date(Math.max(...all.map(d=>d.getTime())));
    min.setDate(min.getDate()-7);
    max.setDate(max.getDate()+14);
    const days = Math.round((max-min)/DAY)+1;
    return { startD: min, days };
  }, [filtered]);

  const todayOffset = Math.round((today-startD)/DAY);

  // 自動捲動到當月（初始化時）
  useEffectG(() => {
    if (!ganttRef.current) return;
    const scrollX = Math.max(0, todayOffset * DAY_W - 160);
    ganttRef.current.scrollLeft = scrollX;
  }, [startD, todayOffset]);

  function dayOffset(dateStr) {
    if (!dateStr) return null;
    return Math.round((new Date(dateStr)-startD)/DAY);
  }

  const months = useMemoG(() => {
    const m = []; let cur=null, count=0, startIdx=0;
    for (let i=0; i<days; i++) {
      const d = new Date(startD.getTime()+i*DAY);
      const key = `${d.getFullYear()}-${d.getMonth()}`;
      if (key!==cur) { if(cur!==null)m.push({label:cur,count,startIdx}); cur=key; count=1; startIdx=i; }
      else count++;
    }
    if (cur!==null) m.push({label:cur,count,startIdx});
    return m.map(m2 => {
      const d = new Date(startD.getTime()+m2.startIdx*DAY);
      return {...m2, label:`${d.getFullYear()}/${d.getMonth()+1}`};
    });
  }, [startD, days]);

  const engineers = window._settings_engineers||K.ENG_ORDER;

  return (
    <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0,overflow:'hidden'}}>
      <div className="toolbar">
        <span className="toolbar-title">時間軸</span>
        <span className="toolbar-sub">{filtered.length} 筆工作</span>
        <div className="toolbar-divider"/>
        <select className="t-sel-pill" value={engF} onChange={e=>setEngF(e.target.value)}>
          <option value="">所有工程師</option>
          {engineers.map(k=><option key={k} value={k}>{K.ENG_FULLLABEL[k]||K.ENG_LABEL[k]||k}</option>)}
        </select>
        <select className="t-sel-pill" value={statusF} onChange={e=>setStatusF(e.target.value)}>
          <option value="">所有進度</option>
          <option value="todo">待處理</option>
          <option value="progress">進行中</option>
          <option value="blocked">封鎖中</option>
          <option value="cancelled">已取消</option>
        </select>
        <button className={`t-pill-btn${showDone?' active':''}`} onClick={()=>setShowDone(v=>!v)}>
          {showDone ? '👁 顯示已完成' : '顯示已完成'}
        </button>
      </div>
      <div className="gantt" ref={ganttRef}>
        <div className="gantt-left">
          <div className="lane-head-sticky">工作 / 客戶</div>
          {filtered.map((d,i)=>{
            const tone=K.ENG_TONE[d.engineer]||{fg:'var(--ink-3)',bg:'var(--line-soft)'};
            const st = K.statusOf(d);
            const statusLabel = {done:'已完成',progress:'進行中',blocked:'等待材料',todo:'待處理',cancelled:'已取消'}[st]||st;
            return (
              <div key={d._id||d.seq} className="lane" style={{background:i%2?'var(--bg-soft)':'var(--bg)',cursor:'default'}}
                onMouseEnter={e=>{setTooltip({item:d,x:e.clientX+14,y:e.clientY-20})}}
                onMouseMove={e=>{setTooltip(v=>v?{...v,x:e.clientX+14,y:e.clientY-20}:v)}}
                onMouseLeave={()=>setTooltip(null)}
              >
                <span className="lane-avatar" style={{color:tone.fg,background:tone.bg}}>{K.ENG_INIT[d.engineer]||d.engineer.slice(0,2)}</span>
                <div className="lane-meta">
                  <span className="lane-name" style={{fontSize:12}}>{d.customer}</span>
                  <span className="lane-sub">{d.dueDate}</span>
                </div>
              </div>
            );
          })}
        </div>
        <div className="gantt-right" style={{position:'relative',minWidth:days*DAY_W}}>
          <div className="scale" style={{height:48}}>
            <div className="scale-months">
              {months.map((m,i)=>(
                <div key={i} className="scale-month" style={{width:m.count*DAY_W,flexShrink:0}}>{m.label}</div>
              ))}
            </div>
            <div className="scale-days">
              {Array.from({length:days}).map((_,i)=>{
                const d=new Date(startD.getTime()+i*DAY);
                const dow=d.getDay();
                const isWeekend=dow===0||dow===6;
                const isToday=i===todayOffset;
                return <div key={i} className={`scale-day${isWeekend?' weekend':''}${isToday?' is-today':''}`} style={{width:DAY_W,flexShrink:0}}>{d.getDate()}</div>;
              })}
            </div>
          </div>
          {filtered.map((item,rowIdx)=>{
            const st=K.statusOf(item);
            const s=dayOffset(item.startDate);
            const e=dayOffset(item.endDate||item.dueDate);
            const due=dayOffset(item.dueDate);
            const actual=dayOffset(item.actualEndDate);
            // 實際完成日晚於期望交期 → 逾期完工，時間軸以紅色標示
            const lateDone = item.actualEndDate && item.dueDate
              && !Number.isNaN(new Date(item.actualEndDate).getTime()) && !Number.isNaN(new Date(item.dueDate).getTime())
              && (new Date(item.actualEndDate) > new Date(item.dueDate));
            const hasBar=s!==null&&e!==null&&e>=s;
            return (
              <div key={item._id||item.seq} className={`row${rowIdx%2?' alt':''}`} style={{height:56,position:'relative'}}>
                {Array.from({length:days}).map((_,i)=>{
                  const d=new Date(startD.getTime()+i*DAY);
                  const isWeekend=d.getDay()===0||d.getDay()===6;
                  return <div key={i} style={{position:'absolute',left:i*DAY_W,top:0,bottom:0,width:DAY_W,borderRight:'1px solid var(--line-soft)',background:isWeekend?'rgba(10,14,20,0.018)':'transparent'}}/>;
                })}
                <div className="today-line" style={{left:todayOffset*DAY_W+DAY_W/2}}/>
                {/* 逾期完工紅色標記：實際完成日的紅色垂直線 + ▲ */}
                {lateDone&&actual!==null&&(
                  <div title={`實際完成 ${item.actualEndDate}（逾期）`} style={{position:'absolute',left:actual*DAY_W+DAY_W/2-1,top:4,bottom:4,width:2,background:'var(--danger)',zIndex:3,pointerEvents:'none'}}>
                    <span style={{position:'absolute',bottom:-3,left:-4,fontSize:9,color:'var(--danger)',lineHeight:1}}>▲</span>
                  </div>
                )}
                {hasBar&&(
                  <div className={`bar ${st}`} style={{left:s*DAY_W,width:Math.max(1,(e-s+1))*DAY_W-2,top:'50%',transform:'translateY(-50%)',...(lateDone?{outline:'2px solid var(--danger)',outlineOffset:1,boxShadow:'0 0 0 3px rgba(192,57,43,0.12)'}:{})}}
                    onMouseEnter={e2=>{setTooltip({item,x:e2.clientX+14,y:e2.clientY-20})}}
                    onMouseMove={e2=>{setTooltip(v=>v?{...v,x:e2.clientX+14,y:e2.clientY-20}:v)}}
                    onMouseLeave={()=>setTooltip(null)}
                  >
                    <div className="bar-fill" style={{width:`${item.progress}%`}}/>
                    <span className="bar-text">{item.customer}{lateDone?' ⚠':''}</span>
                    {due!==null&&due>e&&<div className="bar-due-marker"/>}
                  </div>
                )}
                {!hasBar&&due!==null&&(
                  <div className={`bar todo`} style={{left:due*DAY_W,width:DAY_W-2,top:'50%',transform:'translateY(-50%)',fontSize:9,justifyContent:'center'}}
                    onMouseEnter={e2=>{setTooltip({item,x:e2.clientX+14,y:e2.clientY-20})}}
                    onMouseMove={e2=>{setTooltip(v=>v?{...v,x:e2.clientX+14,y:e2.clientY-20}:v)}}
                    onMouseLeave={()=>setTooltip(null)}
                  >▼</div>
                )}
              </div>
            );
          })}
        </div>
      </div>
      {tooltip&&(()=>{
        const d=tooltip.item;
        const K2=window.K;
        const st=K2.statusOf(d);
        const statusLabel={done:'已完成',progress:'進行中',blocked:'等待材料',todo:'待處理',cancelled:'已取消'}[st]||st;
        const statusColor={done:'var(--ok)',progress:'var(--accent)',blocked:'var(--warn)',todo:'var(--ink-3)',cancelled:'var(--ink-4)'}[st]||'var(--ink-3)';
        const engLabel=K2.ENG_FULLLABEL[d.engineer]||K2.ENG_LABEL[d.engineer]||d.engineer;
        const tone=K2.ENG_TONE[d.engineer]||{fg:'var(--ink-3)',bg:'var(--line-soft)'};
        const today2=K2.TODAY;
        const dueMs=d.dueDate?new Date(d.dueDate)-today2:null;
        const dueDay=dueMs!==null?Math.round(dueMs/K2.DAY):null;
        const dueText=dueDay===null?'—':dueDay<0?`逾期 ${-dueDay} 天`:dueDay===0?'今天到期':`還有 ${dueDay} 天`;
        const dueCol=dueDay!==null&&dueDay<0?'var(--danger)':dueDay!==null&&dueDay<7?'var(--warn)':'var(--ink-2)';
        // clamp position so tooltip stays in viewport
        const tipH=200; const tipW=230;
        const yPos=Math.min(tooltip.y, window.innerHeight-tipH-12);
        const xPos=Math.min(tooltip.x, window.innerWidth-tipW-12);
        return (
          <div style={{
            position:'fixed',left:xPos,top:yPos,zIndex:9999,
            background:'var(--bg)',border:'1px solid var(--line)',borderRadius:10,
            boxShadow:'0 8px 24px rgba(10,14,20,0.13)',
            padding:'12px 14px',width:230,pointerEvents:'none',
            fontFamily:'var(--font-ui)',fontSize:12
          }}>
            <div style={{fontWeight:700,fontSize:13,color:'var(--ink)',marginBottom:8,lineHeight:1.3}}>{d.customer}</div>
            <div style={{display:'flex',flexDirection:'column',gap:5,color:'var(--ink-2)'}}>
              <div style={{display:'flex',justifyContent:'space-between'}}>
                <span style={{color:'var(--ink-4)'}}>單號</span>
                <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--accent)'}}>{d.orderId||d._id||'—'}</span>
              </div>
              <div style={{display:'flex',justifyContent:'space-between'}}>
                <span style={{color:'var(--ink-4)'}}>工程師</span>
                <span style={{display:'flex',alignItems:'center',gap:5}}>
                  <span style={{width:16,height:16,borderRadius:'50%',background:tone.bg,color:tone.fg,fontSize:9,fontWeight:700,display:'inline-flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-mono)'}}>{K2.ENG_INIT[d.engineer]||d.engineer.slice(0,2)}</span>
                  {engLabel}
                </span>
              </div>
              <div style={{display:'flex',justifyContent:'space-between'}}>
                <span style={{color:'var(--ink-4)'}}>機台</span>
                <span style={{fontFamily:'var(--font-mono)',fontSize:11}}>{d.machine||'—'}</span>
              </div>
              <div style={{display:'flex',justifyContent:'space-between'}}>
                <span style={{color:'var(--ink-4)'}}>期望交期</span>
                <span style={{color:dueCol,fontFamily:'var(--font-mono)',fontSize:11}}>{d.dueDate||'—'}<span style={{marginLeft:5,fontSize:10,opacity:.8}}>{dueText}</span></span>
              </div>
              {d.actualEndDate&&(()=>{
                const lateTip = d.dueDate && !Number.isNaN(new Date(d.actualEndDate).getTime()) && !Number.isNaN(new Date(d.dueDate).getTime()) && (new Date(d.actualEndDate)>new Date(d.dueDate));
                return <div style={{display:'flex',justifyContent:'space-between'}}>
                  <span style={{color:'var(--ink-4)'}}>實際完成</span>
                  <span style={{color:lateTip?'var(--danger)':'var(--ink-2)',fontFamily:'var(--font-mono)',fontSize:11,fontWeight:lateTip?700:400}}>{d.actualEndDate}{lateTip?' ⚠ 逾期':''}</span>
                </div>;
              })()}
              <div style={{display:'flex',justifyContent:'space-between'}}>
                <span style={{color:'var(--ink-4)'}}>進度</span>
                <span style={{color:'var(--ink-2)'}}>{d.progress||0}%</span>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{color:'var(--ink-4)'}}>狀態</span>
                <span style={{background:statusColor,color:'#fff',borderRadius:999,padding:'1px 8px',fontSize:10,fontFamily:'var(--font-mono)',fontWeight:600}}>{statusLabel}</span>
              </div>
              {d.material&&<div style={{display:'flex',justifyContent:'space-between'}}>
                <span style={{color:'var(--ink-4)'}}>材料</span>
                <span>{d.material}</span>
              </div>}
            </div>
          </div>
        );
      })()}
    </div>
  );
}
window.GanttView = GanttView;
</script>

<!-- ④ DashboardView -->
<script type="text/babel" data-presets="react">
function DashboardView({ data }) {
  const K = window.K;
  const { useMemo, useState } = React;

  const STATUS_COLORS = { todo:'#cbd0d8', blocked:'var(--warn)', progress:'var(--accent)', done:'var(--ok)', cancelled:'#b0b5bf' };
  const ENG_COLORS = ['var(--accent)','var(--purple)','var(--ok)','var(--warn)','var(--danger)','var(--accent)'];
  const MACH_COLORS = ['var(--accent)','var(--ok)','var(--warn)','var(--purple)'];

  // ── KPI 統計 ──
  const stats = useMemo(() => {
    const total    = data.length;
    const wip      = data.filter(d=>K.statusOf(d)==='progress').length;
    const blocked  = data.filter(d=>K.statusOf(d)==='blocked').length;
    const done     = data.filter(d=>K.statusOf(d)==='done').length;
    const due7     = data.filter(d=>{ const s=K.statusOf(d); if(s==='done'||s==='cancelled')return false; const v=K.daysUntil(d.dueDate); return v!==null&&v<=7&&v>=0; }).length;
    const statusDist = {
      todo:      data.filter(d=>K.statusOf(d)==='todo').length,
      blocked,
      progress:  wip,
      done,
      cancelled: data.filter(d=>K.statusOf(d)==='cancelled').length,
    };
    const engineers = window._settings_engineers||K.ENG_ORDER;
    const machines  = window._settings_machines||K.MACHINES;
    const byEng={}, byMach={}, byProg={0:0,25:0,50:0,75:0,100:0}, byMat={};
    const byCat={}; (K.CATEGORIES||[]).forEach(c=>{byCat[c]=0;}); byCat['未指定']=0;
    engineers.forEach(k=>{byEng[k]=0;}); machines.forEach(m=>{byMach[m]=0;});
    data.forEach(d=>{
      if(d.engineer) byEng[d.engineer]=(byEng[d.engineer]||0)+1;
      if(d.machine)  byMach[d.machine]=(byMach[d.machine]||0)+1;
      const p = K.PROGRESS_VALUES.includes(d.progress)?d.progress:0;
      byProg[p]=(byProg[p]||0)+1;
      const mat=d.material||'足夠'; byMat[mat]=(byMat[mat]||0)+1;
      const cat=d.category||'未指定'; byCat[cat]=(byCat[cat]||0)+1;
    });
    const byCustomer={};
    data.forEach(d=>{ const c=d.customer||'—'; byCustomer[c]=(byCustomer[c]||0)+1; });
    // 依材料種類（樹脂）分析：以 resin 分組，未指定另計
    const byResin={};
    data.forEach(d=>{ const r=d.resin||'未指定'; byResin[r]=(byResin[r]||0)+1; });
    // 異常統計：逾期完工（實際完成日晚於期望交期）、超耗（實際消耗量 > 預估消耗量）＋負責工程師分布
    const DAY=K.DAY;
    const isLate = d => d.actualEndDate && d.dueDate && !Number.isNaN(new Date(d.actualEndDate).getTime()) && !Number.isNaN(new Date(d.dueDate).getTime()) && (new Date(d.actualEndDate)-new Date(d.dueDate))/DAY > 0;
    const isOver = d => d.actUsage!=null && d.actUsage!=='' && d.estUsage!=null && d.estUsage!=='' && (+d.actUsage > +d.estUsage);
    const lateOrders = data.filter(isLate);
    const overOrders = data.filter(isOver);
    const byEngLate={}, byEngOver={};
    engineers.forEach(k=>{ byEngLate[k]=0; byEngOver[k]=0; });
    lateOrders.forEach(d=>{ if(d.engineer) byEngLate[d.engineer]=(byEngLate[d.engineer]||0)+1; });
    overOrders.forEach(d=>{ if(d.engineer) byEngOver[d.engineer]=(byEngOver[d.engineer]||0)+1; });
    return { total,wip,blocked,done,due7,statusDist,byEng,byMach,byProg,byMat,byCat,byResin,byCustomer,engineers,machines,
             lateCount:lateOrders.length, overCount:overOrders.length, byEngLate, byEngOver };
  }, [data]);

  // ── 圖表元件 ──
  function DonutChart({ slices, centerLabel }) {
    const total = slices.reduce((s,x)=>s+x.value,0);
    if (!total) return <div className="chart-empty">無資料</div>;
    const R=68, cx=90, cy=90, thick=20;
    let acc=0;
    const paths=slices.filter(s=>s.value>0).map(sl=>{
      const pct=sl.value/total;
      const s0=acc*2*Math.PI-Math.PI/2; acc+=pct; const s1=acc*2*Math.PI-Math.PI/2;
      const large=pct>0.5?1:0;
      const x1=cx+R*Math.cos(s0),y1=cy+R*Math.sin(s0),x2=cx+R*Math.cos(s1),y2=cy+R*Math.sin(s1);
      return <path key={sl.label} d={`M${cx} ${cy} L${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2}Z`} fill={sl.color} stroke="var(--bg)" strokeWidth="2"/>;
    });
    return (
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12,width:'100%'}}>
        <div style={{position:'relative',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="180" height="180" viewBox="0 0 180 180">
            {paths}
            <circle cx={cx} cy={cy} r={R-thick} fill="var(--bg)"/>
          </svg>
          <div style={{position:'absolute',textAlign:'center',pointerEvents:'none'}}>
            <div style={{fontSize:28,fontWeight:700,fontFamily:'var(--font-mono)',letterSpacing:'-0.02em',color:'var(--ink)',lineHeight:1}}>{total}</div>
            <div style={{fontSize:10,color:'var(--ink-3)',fontFamily:'var(--font-mono)',marginTop:3,letterSpacing:'0.06em',textTransform:'uppercase'}}>{centerLabel||'總計'}</div>
          </div>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:'4px 10px',justifyContent:'center',fontSize:10.5,color:'var(--ink-2)',fontFamily:'var(--font-mono)'}}>
          {slices.filter(s=>s.value>0).map(s=>(
            <span key={s.label} style={{display:'inline-flex',alignItems:'center',gap:4}}>
              <span style={{width:8,height:8,borderRadius:2,background:s.color,flexShrink:0}}/>
              {s.label} · {s.value}
            </span>
          ))}
        </div>
      </div>
    );
  }

  function HBarChart({ items, colorFn }) {
    const max = Math.max(1,...items.map(i=>i.value));
    return (
      <div style={{display:'flex',flexDirection:'column',gap:10,width:'100%',padding:'4px 0'}}>
        {items.filter(i=>i.value>0).map((item,idx)=>(
          <div key={item.label} style={{display:'grid',gridTemplateColumns:'90px 1fr 28px',gap:10,alignItems:'center'}}>
            <span style={{fontSize:11.5,color:'var(--ink-2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.label}</span>
            <div style={{height:14,background:'var(--bg-soft)',borderRadius:4,overflow:'hidden',position:'relative'}}>
              <div style={{position:'absolute',inset:'0 auto 0 0',borderRadius:4,transition:'width .3s',background:colorFn?colorFn(item,idx):'var(--accent)',width:`${Math.round(item.value/max*100)}%`}}/>
            </div>
            <span style={{fontSize:11,fontFamily:'var(--font-mono)',color:'var(--ink-2)',textAlign:'right'}}>{item.value}</span>
          </div>
        ))}
        {items.every(i=>i.value===0)&&<div className="chart-empty">無資料</div>}
      </div>
    );
  }

  function VBarChart({ items, colorFn }) {
    const max = Math.max(1,...items.map(i=>i.value));
    const H = 140;
    return (
      <div style={{width:'100%',display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
        <svg width="100%" height={H+30} viewBox={`0 0 ${items.length*56} ${H+30}`} preserveAspectRatio="xMidYMid meet">
          {[0,Math.ceil(max/2),max].map((v,i)=>{
            const y=H-Math.round(v/max*H);
            return <g key={i}><line x1={0} y1={y} x2={items.length*56} y2={y} stroke="var(--line-soft)" strokeWidth="1"/><text x={-2} y={y+4} fontSize="9" fill="var(--ink-4)" textAnchor="end">{v}</text></g>;
          })}
          {items.map((item,idx)=>{
            const bw=34, bx=idx*56+11;
            const bh=max>0?Math.max(2,Math.round(item.value/max*H)):0;
            const by=H-bh;
            const fill=colorFn?colorFn(item,idx):'var(--accent)';
            return (
              <g key={item.label}>
                <rect x={bx} y={by} width={bw} height={bh} fill={fill} rx="3"/>
                {item.value>0&&<text x={bx+bw/2} y={by-4} fontSize="9" fill="var(--ink-3)" textAnchor="middle">{item.value}</text>}
                <text x={bx+bw/2} y={H+14} fontSize="9" fill="var(--ink-4)" textAnchor="middle">{item.label}</text>
              </g>
            );
          })}
        </svg>
      </div>
    );
  }

  // ── 自由分析 ──
  const DIM_OPTIONS = [
    { key:'status',   label:'依 狀態' },
    { key:'engineer', label:'依 工程師' },
    { key:'progress', label:'依 進度' },
    { key:'machine',  label:'依 機台' },
    { key:'resin',    label:'依 材料種類' },
    { key:'category', label:'依 類型' },
    { key:'customer', label:'依 客戶（Top 8）' },
  ];
  const CHART_OPTIONS = [
    { key:'donut', label:'環狀圖' },
    { key:'hbar',  label:'橫條圖' },
    { key:'vbar',  label:'直條圖' },
  ];

  function buildSlices(dim) {
    switch(dim) {
      case 'status': return Object.entries(stats.statusDist).map(([k,v],i)=>({ label:K.STATUS_TONE[k]?.label||k, value:v, color:STATUS_COLORS[k] }));
      case 'engineer': return stats.engineers.map((k,i)=>({ label:K.ENG_FULLLABEL[k]||K.ENG_LABEL[k]||k, value:stats.byEng[k]||0, color:ENG_COLORS[i%ENG_COLORS.length] }));
      case 'progress': return K.PROGRESS_VALUES.map((p,i)=>({ label:`${p}%`, value:stats.byProg[p]||0, color:MACH_COLORS[i%MACH_COLORS.length] }));
      case 'machine':  return stats.machines.map((m,i)=>({ label:m, value:stats.byMach[m]||0, color:MACH_COLORS[i%MACH_COLORS.length] }));
      case 'resin': { const RCOL=['var(--accent)','var(--purple)','var(--ok)','var(--warn)','var(--danger)','var(--accent)','var(--warn)','var(--warn)']; return Object.entries(stats.byResin).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({ label:k, value:v, color:k==='未指定'?'#b0b5bf':RCOL[i%RCOL.length] })); }
      case 'category': { const CAT_COLORS={'代工':'var(--purple)','評估':'var(--accent)','未指定':'#b0b5bf'}; return Object.entries(stats.byCat).map(([k,v])=>({ label:k, value:v, color:CAT_COLORS[k]||'var(--ink-4)' })); }
      case 'customer': {
        const sorted=Object.entries(stats.byCustomer).sort((a,b)=>b[1]-a[1]).slice(0,8);
        return sorted.map(([k,v],i)=>({ label:k, value:v, color:'var(--accent)' }));
      }
      default: return [];
    }
  }

  function CustomChart({ idx }) {
    const [dim,   setDim]   = useState(idx===0?'machine':idx===1?'category':'customer');
    const [chart, setChart] = useState(idx===2?'hbar':'donut');
    const slices = buildSlices(dim);
    const colorFn = (item, i) => slices[i]?.color || 'var(--accent)';
    const centerLabel = DIM_OPTIONS.find(d=>d.key===dim)?.label.replace('依 ','');

    const SEL = { height:32, padding:'0 26px 0 10px', border:'1px solid var(--line)', borderRadius:6, background:'var(--bg)', color:'var(--ink-2)', font:'inherit', fontSize:12.5, cursor:'pointer', WebkitAppearance:'none', appearance:'none', backgroundImage:"url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%235a6270' stroke-width='1.4'/></svg>\")", backgroundRepeat:'no-repeat', backgroundPosition:'right 7px center', flex:1, minWidth:0 };

    return (
      <div style={{border:'1px solid var(--line)',borderRadius:8,background:'var(--bg)',padding:'14px 16px 18px',display:'flex',flexDirection:'column',gap:14}}>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontSize:11,color:'var(--accent)',marginRight:2}}>⊕</span>
          <span style={{fontSize:12.5,fontWeight:600,color:'var(--ink)'}}>自由分析 #{idx+1}</span>
        </div>
        <div style={{display:'flex',gap:8}}>
          <select style={SEL} value={dim} onChange={e=>setDim(e.target.value)}>
            {DIM_OPTIONS.map(d=><option key={d.key} value={d.key}>{d.label}</option>)}
          </select>
          <select style={SEL} value={chart} onChange={e=>setChart(e.target.value)}>
            {CHART_OPTIONS.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}
          </select>
        </div>
        <div style={{display:'flex',justifyContent:'center',alignItems:'center',minHeight:200}}>
          {chart==='donut' && <DonutChart slices={slices} centerLabel={centerLabel}/>}
          {chart==='hbar'  && <HBarChart  items={slices} colorFn={colorFn}/>}
          {chart==='vbar'  && <VBarChart  items={slices} colorFn={colorFn}/>}
        </div>
      </div>
    );
  }

  // ── 預設固定圖表 ──
  const statusSlices  = Object.entries(stats.statusDist).map(([k,v])=>({ label:K.STATUS_TONE[k]?.label||k, value:v, color:STATUS_COLORS[k] }));
  const engItems      = stats.engineers.map((k,i)=>({ label:K.ENG_FULLLABEL[k]||K.ENG_LABEL[k]||k, value:stats.byEng[k]||0, color:ENG_COLORS[i%ENG_COLORS.length] }));
  const progItems     = K.PROGRESS_VALUES.map((p,i)=>({ label:`${p}%`, value:stats.byProg[p]||0, color:MACH_COLORS[i%MACH_COLORS.length] }));

  const CARD = { border:'1px solid var(--line)', borderRadius:8, background:'var(--bg)', padding:'14px 16px 18px', display:'flex', flexDirection:'column', gap:12 };
  const CARD_HEAD = { display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:4 };
  const CARD_TITLE = { fontSize:12.5, fontWeight:600, color:'var(--ink)' };
  const CARD_BADGE = { fontSize:10, fontFamily:'var(--font-mono)', color:'var(--ink-4)', letterSpacing:'0.06em', textTransform:'uppercase' };

  return (
    <div style={{flex:1,overflow:'auto',padding:'0 28px 32px',background:'var(--bg)'}}>

      {/* KPI */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:0,borderBottom:'1px solid var(--line)',margin:'0 -28px 0',padding:'0 28px'}}>
        {[
          { label:'總訂單',    value:stats.total,  sub:'全部資料筆數',          color:'var(--ink)' },
          { label:'進行中',    value:stats.wip,    sub:'已開工未完成',          color:'var(--ink)' },
          { label:'等待材料',  value:stats.blocked,sub:'需調撥 / 待備料',       color:'var(--warn)'    },
          { label:'7 天內到期',value:stats.due7,   sub:'未完成且交期 ≤ 7 天',  color:'var(--danger)'    },
          { label:'已完成',    value:stats.done,   sub:'100% / 完成',          color:'var(--ok)'    },
        ].map((k,i)=>(
          <div key={k.label} style={{padding:'18px 24px 20px',borderRight:i<4?'1px solid var(--line-soft)':'none'}}>
            <div style={{fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--ink-4)',fontWeight:600,fontFamily:'var(--font-mono)'}}>{k.label}</div>
            <div style={{fontSize:32,fontWeight:700,fontFamily:'var(--font-mono)',letterSpacing:'-0.02em',color:k.color,marginTop:4,lineHeight:1.1}}>{k.value}</div>
            <div style={{fontSize:11,color:'var(--ink-4)',marginTop:4,fontFamily:'var(--font-mono)'}}>{k.sub}</div>
          </div>
        ))}
      </div>

      {/* 預設分析 */}
      <div style={{display:'flex',alignItems:'baseline',gap:10,padding:'20px 0 14px'}}>
        <span style={{fontSize:14,fontWeight:700,color:'var(--ink)'}}>預設分析</span>
        <span style={{fontSize:10.5,color:'var(--ink-4)',fontFamily:'var(--font-mono)',letterSpacing:'0.06em',textTransform:'uppercase'}}>DEFAULT VIEWS</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,marginBottom:32}}>

        {/* 狀態分布 Donut */}
        <div style={CARD}>
          <div style={CARD_HEAD}>
            <span style={CARD_TITLE}>狀態分布</span>
            <span style={CARD_BADGE}>DONUT</span>
          </div>
          <div style={{display:'flex',justifyContent:'center',alignItems:'center',flex:1,minHeight:220}}>
            <DonutChart slices={statusSlices} centerLabel="總訂單"/>
          </div>
        </div>

        {/* 工程師負荷 HBar */}
        <div style={CARD}>

            <span style={CARD_TITLE}>工程師負荷</span>
            <span style={CARD_BADGE}>HORIZONTAL BAR</span>
          </div>
          <div style={{display:'flex',alignItems:'center',flex:1,minHeight:220}}>

        </div>

        {/* 進度分布 VBar */}

          <div style={CARD_HEAD}>

            <span style={CARD_BADGE}>VERTICAL BAR</span>

          <div style={{display:'flex',alignItems:'center',justifyContent:'center',flex:1,minHeight:220}}>
            <VBarChart items={progItems} colorFn={(item,i)=>MACH_COLORS[i%MACH_COLORS.length]}/>
          </div>

      {/* 異常分析：逾期完工 / 超耗 筆數 + 負責工程師分布 */}

        <span style={{fontSize:10.5,color:'var(--ink-4)',fontFamily:'var(--font-mono)',letterSpacing:'0.06em',textTransform:'uppercase'}}>ANOMALIES — 逾期完工 / 超耗 與負責工程師</span>

          { title:'消耗超標', badge:'實際消耗量大於預估消耗量', count:stats.overCount, color:'var(--warn)', by:stats.byEngOver },

          const items = stats.engineers.map((k,i)=>({ label:K.ENG_FULLLABEL[k]||K.ENG_LABEL[k]||k, value:a.by[k]||0, color:a.color }));
