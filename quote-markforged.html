<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markforged 估價（Beta）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* 色票與 quote-studio.html 一致，切換深色模式時兩頁外觀同步 */
:root{
  --fs:1;
  --bg1:#ffffff; --bg2:#f6f8fa;
  --glass:rgba(255,255,255,.9); --glass2:rgba(255,255,255,.85);
  --line:#e6e8ec; --lineGlass:rgba(230,232,236,.95);
  --ink:#0a0e14; --ink2:#3b4250; --ink3:#5a6270; --ink4:#8a93a3;
  --accent:#0c7a99; --accentBg:#e6f1f6;
  --ok:#1d6f43; --okBg:#e6f1ea; --okLine:#b6d9c4;
  --warn:#c79b2a; --warnBg:#fbf3dc; --warnLine:#ecdcae; --warnText:#8b6b13;
  --err:#c0392b; --errBg:#fbe7e3; --errLine:#ecc9c9;
  --purple:#7b5ec7; --purpleBg:#efeafb;
  --mono:'JetBrains Mono',monospace;
  --shadow:0 10px 32px rgba(10,14,20,.12);
  --shadowSm:0 4px 16px rgba(10,14,20,.08);
  --panelBg:#ffffff;
}
:root[data-theme="dark"]{
  --bg1:#12151b; --bg2:#0a0d12;
  --glass:rgba(24,28,36,.9); --glass2:rgba(24,28,36,.85);
  --line:#2a2f3a; --lineGlass:rgba(42,47,58,.95);
  --ink:#eef1f5; --ink2:#c3c9d4; --ink3:#9aa2b0; --ink4:#6b7280;
  --accent:#3fb6d8; --accentBg:#173540;
  --ok:#4bcf8b; --okBg:#123a29; --okLine:#1f5c40;
  --warn:#e0b64a; --warnBg:#3a331c; --warnLine:#5a4a26; --warnText:#e0b64a;
  --err:#e0605a; --errBg:#3a2422; --errLine:#5a3330;
  --purple:#a68af0; --purpleBg:#251c40;
  --shadow:0 10px 32px rgba(0,0,0,.4);
  --shadowSm:0 4px 16px rgba(0,0,0,.3);
  --panelBg:#1b1f27;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2));
  font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);font-size:calc(14px * var(--fs))}
button{font-family:inherit}
#c3d{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--lineGlass);border-radius:12px;box-shadow:var(--shadow)}
.glass-sm{background:var(--glass2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid var(--lineGlass);box-shadow:var(--shadowSm)}
.mono{font-family:var(--mono)}
.lbl{font-size:calc(9.5px * var(--fs));font-weight:600;font-family:var(--mono);color:var(--ink4);
  text-transform:uppercase;letter-spacing:.07em;margin:10px 0 5px}
.lbl:first-child{margin-top:0}

#topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:flex-start;gap:8px;pointer-events:none;z-index:20}
/* 只讓實際的控制項吃指標事件；置中用的 flex 空白 div 不可設 auto，否則會擋掉整條頂部的拖曳 */
#brand,#viewbar,#cubeWrap{pointer-events:auto}

/* 視角方塊（右上角） */
#cubeWrap{display:flex;flex-direction:column;gap:5px;align-items:center}
#cube{width:52px;height:52px;perspective:200px}
#cubeInner{transform-style:preserve-3d;transform:rotateX(-22deg) rotateY(-38deg);
  width:52px;height:52px;position:relative;transition:transform .18s}
.cface{position:absolute;width:52px;height:52px;display:flex;align-items:center;justify-content:center;
  font-size:calc(11px * var(--fs));font-weight:600;color:var(--ink3);background:var(--glass2);
  border:1px solid var(--line);cursor:pointer;user-select:none;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cface:hover{background:var(--accentBg);color:var(--accent)}
#cubeHome{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);
  font-size:calc(11px * var(--fs));cursor:pointer;color:var(--ink3)}
/* 擺放面板（PreForm 式）。top 對齊 modPanel，一起讓開視角方塊 */
#placePanel{position:absolute;top:112px;right:72px;width:calc(218px * var(--fs));padding:12px;z-index:17;display:none}
#placePanel.open{display:block}
#placePanel h4{font-size:calc(12px * var(--fs));display:flex;justify-content:space-between;align-items:center}
#placePanel h4 .x{color:var(--ink4);cursor:pointer;font-weight:400}
.ppHint{font-size:calc(9px * var(--fs));color:var(--ink4);line-height:1.6;margin-top:5px}
.ppHint b{color:var(--ink2)}
.inRow{display:flex;align-items:center;gap:6px;margin-bottom:5px;margin-top:8px}
.inRow label{font-size:calc(11px * var(--fs));color:var(--ink3);flex:1}
.inRow input[type=number]{width:86px;height:24px;border:1px solid var(--line);border-radius:5px;
  background:var(--panelBg);color:var(--ink);font-family:var(--mono);font-size:calc(11px * var(--fs));
  text-align:right;padding:0 6px;outline:none}
.inRow .un{font-size:calc(9px * var(--fs));color:var(--ink4);font-family:var(--mono);width:38px}
#placePanel .inRow input.outR{border-color:var(--err);color:var(--err)}
.arrowPad{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:8px}
.arrowPad button{padding:6px 0;border-radius:5px;border:1px solid var(--line);background:var(--panelBg);
  color:var(--ink3);font-size:calc(11px * var(--fs));font-weight:700;cursor:pointer;font-family:inherit}
.arrowPad button:hover{border-color:var(--accent);color:var(--accent)}
.arrowPad button.c{background:var(--accent);color:#fff;border-color:var(--accent)}
.arrowPad .empty{visibility:hidden}
.ppFace{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:7px;margin-top:8px;
  border-radius:6px;border:1.5px solid var(--accent);background:var(--panelBg);color:var(--accent);
  font:inherit;font-size:calc(11px * var(--fs));font-weight:700;cursor:pointer}
.ppFace.on{background:var(--accent);color:#fff}
/* 框選矩形 */
#selBox{position:absolute;border:1px dashed var(--accent);background:rgba(12,122,153,.10);
  z-index:10;display:none;pointer-events:none}
/* 操作提示（不可吃指標事件，否則會擋住底部的拖曳） */
#opHint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:12;
  padding:6px 14px;border-radius:999px;font-size:calc(10.5px * var(--fs));color:var(--ink3);
  white-space:nowrap;pointer-events:none}
#opHint b{color:var(--ink2)}
#brand{display:flex;align-items:center;gap:8px;border-radius:8px;padding:7px 12px}
#brand b{font-size:calc(13.5px * var(--fs))}
#brand .tag{height:17px;padding:0 8px;font-size:calc(10px * var(--fs));border-radius:999px;font-family:var(--mono);
  font-weight:600;background:var(--accentBg);color:var(--accent);display:inline-flex;align-items:center}
/* 品牌切換鈕：與 quote-studio.html 對稱，兩支獨立檔案，此鈕只是換頁。 */
.brandSwitch{display:flex;gap:2px;background:var(--bg2);border-radius:7px;padding:2px;margin-left:2px}
.brandSwitch button{border:0;background:transparent;border-radius:5px;padding:3px 9px;cursor:pointer;
  font:inherit;font-size:calc(10.5px * var(--fs));font-weight:600;color:var(--ink4)}
.brandSwitch button.on{background:var(--panelBg);color:var(--ink);box-shadow:var(--shadowSm)}
#viewbar{display:flex;gap:5px;border-radius:8px;padding:5px;align-items:center}
.vtab{padding:4px 10px;border-radius:5px;border:1px solid transparent;font-size:calc(11px * var(--fs));font-weight:600;
  cursor:pointer;background:transparent;color:var(--ink3)}
.vtab.on{border-color:var(--line);color:var(--ink);background:var(--panelBg)}
.vsep{width:1px;height:16px;background:var(--line)}
.abtn{padding:4px 9px;border-radius:5px;border:1px solid var(--line);font-size:calc(11px * var(--fs));
  cursor:pointer;background:var(--panelBg);color:var(--ink3)}
.abtn.on{border-color:var(--accent);color:var(--accent)}

#stepCard{position:absolute;top:64px;left:14px;width:calc(318px * var(--fs));max-height:calc(100vh - 92px);
  display:flex;flex-direction:column;z-index:15;overflow:hidden}
#stepHead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
#stepHead b{flex:1;font-size:calc(12.5px * var(--fs))}
#stepCount{font-family:var(--mono);font-size:calc(10px * var(--fs));color:var(--ink4)}
#stepHide{border:1px solid var(--line);background:var(--panelBg);border-radius:5px;width:22px;height:22px;
  cursor:pointer;color:var(--ink3);font-size:calc(10px * var(--fs));flex-shrink:0}
#stepBody{padding:12px;overflow-y:auto}
#stepShow{position:absolute;top:64px;left:14px;z-index:15;border-radius:8px;padding:7px 11px;
  font-size:calc(11px * var(--fs));font-weight:600;color:var(--ink3);cursor:pointer}
.dock{display:flex;gap:3px;margin-bottom:10px;flex-wrap:wrap}
.dockBtn{flex:1;min-width:52px;padding:5px 2px;border-radius:5px;border:1px solid var(--line);background:var(--panelBg);
  color:var(--ink4);font:inherit;font-size:calc(9.5px * var(--fs));font-weight:600;cursor:pointer}
.dockBtn.cur{border-color:var(--accent);color:var(--accent);background:var(--accentBg)}
.dockBtn.done{color:var(--ok);border-color:var(--okLine)}

.fileRow{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:6px 9px;
  background:var(--panelBg);margin-bottom:5px;cursor:pointer}
.fileRow.on{border-color:var(--accent);background:var(--accentBg)}
.delBtn{border:0;background:transparent;color:var(--ink4);cursor:pointer;font-size:12px;padding:0 2px;flex-shrink:0}
.delBtn:hover{color:var(--err)}
.machRow{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;
  background:var(--panelBg);cursor:pointer;margin-bottom:4px}
.machRow.on{border-color:var(--accent);background:var(--accentBg)}
.machRow b{font-size:calc(11.5px * var(--fs))}
.machRow small{font-size:calc(9.5px * var(--fs));color:var(--ink4);font-family:var(--mono)}
.sel{width:100%;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panelBg);
  color:var(--ink2);font:inherit;font-size:calc(12px * var(--fs))}
.num{width:100%;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panelBg);
  color:var(--ink);font-family:var(--mono);font-size:calc(11.5px * var(--fs));text-align:right}
.seg{flex:1;padding:6px 3px;border-radius:5px;border:1px solid var(--line);background:var(--panelBg);color:var(--ink3);
  font-size:calc(10.5px * var(--fs));font-weight:600;cursor:pointer}
.seg.on{border-color:var(--accent);background:var(--accent);color:#fff}
.pbtn{width:100%;padding:8px;border-radius:6px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;
  font:inherit;font-size:calc(11.5px * var(--fs));font-weight:700;cursor:pointer;margin-top:8px}
.ghostBtn{width:100%;padding:7px;border-radius:6px;background:var(--panelBg);color:var(--ink3);border:1px solid var(--line);
  font:inherit;font-size:calc(11.5px * var(--fs));font-weight:600;cursor:pointer;margin-top:6px}
.mnote{font-size:calc(10px * var(--fs));color:var(--ink4);line-height:1.6;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:calc(11px * var(--fs))}
.kv span:first-child{color:var(--ink4)}
.kv span:last-child{font-family:var(--mono);color:var(--ink2)}

/* 右側工具列必須讓開視角方塊：方塊自 top:14px 起、含 Home 鈕約 81px 高，
   若沿用 top:64px 會直接壓在方塊上，兩邊互相擋住點不到。 */
#rail{position:absolute;top:112px;right:14px;display:flex;flex-direction:column;gap:4px;padding:6px;z-index:15}
.railBtn{width:42px;height:42px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink3);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px}
.railBtn small{font-size:calc(8px * var(--fs));font-weight:600;transform:scale(.92)}
.railBtn:hover{background:var(--panelBg);border-color:var(--line)}
.railBtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#modPanel{position:absolute;top:112px;right:70px;width:calc(340px * var(--fs));max-height:calc(100vh - 140px);
  display:none;flex-direction:column;z-index:15;overflow:hidden}
#modPanel.open{display:flex}
#modHead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
#modHead b{flex:1;font-size:calc(12.5px * var(--fs))}
#modClose{border:0;background:transparent;color:var(--ink4);cursor:pointer;font-size:14px}
#modBody{padding:12px;overflow-y:auto}

.chk{border:1px solid var(--line);border-left:3px solid var(--ink4);background:var(--panelBg);border-radius:4px;
  padding:6px 9px;margin-bottom:5px}
.chk .th{display:flex;align-items:center;gap:6px;font-size:calc(11px * var(--fs));font-weight:600}
.chk .td{font-size:calc(10px * var(--fs));color:var(--ink3);line-height:1.55;margin-top:3px}
.chk.pass{border-left-color:var(--ok)}   .chk.pass .th{color:var(--ok)}
.chk.warn{border-left-color:var(--warn)} .chk.warn .th{color:var(--warnText)}
.chk.fail{border-left-color:var(--err)}  .chk.fail .th{color:var(--err)}
.chk.manual{border-left-color:var(--purple)} .chk.manual .th{color:var(--purple)}
.chk .way{margin-left:auto;font-family:var(--mono);font-size:calc(8.5px * var(--fs));color:var(--ink4);
  border:1px solid var(--line);border-radius:3px;padding:0 4px}
.catHead{font-size:calc(10.5px * var(--fs));font-weight:700;color:var(--ink2);margin:12px 0 5px}
.catHead:first-child{margin-top:0}
.fcCnt{display:flex;gap:5px;margin-bottom:9px}
.fcCnt div{flex:1;text-align:center;padding:5px 2px;border-radius:6px;border:1px solid var(--line);background:var(--panelBg)}
.fcCnt b{display:block;font-family:var(--mono);font-size:calc(14px * var(--fs))}
.fcCnt small{font-size:calc(8.5px * var(--fs));color:var(--ink4)}

/* 忙碌遮罩（STEP 載入 CAD 核心／鑲嵌時） */
#busy{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  background:rgba(10,14,20,.45);backdrop-filter:blur(3px)}
#busy .box{display:flex;align-items:center;gap:12px;padding:16px 22px;border-radius:10px;
  background:var(--panelBg);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:calc(12px * var(--fs));color:var(--ink2)}
#busy .spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;padding:9px 16px;border-radius:8px;
  font-size:calc(11.5px * var(--fs));font-weight:600;display:none;box-shadow:var(--shadow)}
#toast.ok{background:var(--okBg);color:var(--ok);border:1px solid var(--okLine)}
#toast.err{background:var(--errBg);color:var(--err);border:1px solid var(--errLine)}
#toast.inf{background:var(--accentBg);color:var(--accent);border:1px solid var(--line)}
/* 未登入提示：刻意「不」做成全螢幕遮罩 —— STL 載入與幾何分析全在本機執行、不碰後端，
   擋住只會讓人連模型都轉不動。只有讀價格/儲存需要登入，那些操作各自另有把關。 */
#gate{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);z-index:40;display:none;
  pointer-events:none}
#gate .box{pointer-events:auto;padding:10px 16px;border-radius:10px;background:var(--warnBg);
  border:1px solid var(--warnLine);color:var(--warnText);box-shadow:var(--shadowSm);
  display:flex;align-items:center;gap:10px;font-size:calc(11px * var(--fs))}
#gate .box b{font-size:calc(11.5px * var(--fs))}
#gate .box .sub{color:var(--ink3);font-size:calc(10px * var(--fs))}
#gateClose{border:0;background:transparent;color:var(--ink4);cursor:pointer;font-size:13px;padding:0 2px}
</style>
</head>
<body>
<canvas id="c3d"></canvas>

<div id="topbar">
  <div id="brand" class="glass-sm">
    <b>Markforged 估價</b><span class="tag">Beta</span>
    <div class="brandSwitch">
      <button id="btnGoFl" title="切換到 Formlabs 估價（不同工藝，另一支獨立頁面）">Formlabs</button>
      <button class="on" disabled title="目前頁面">Markforged</button>
    </div>
  </div>
  <div style="flex:1"></div>
  <div id="viewbar" class="glass-sm">
    <button class="vtab on" data-view="persp">透視</button>
    <button class="vtab" data-view="top">頂視</button>
    <button class="vtab" data-view="front">前視</button>
    <button class="vtab" data-view="side">側視</button>
    <div class="vsep"></div>
    <button class="abtn" id="btnFaceDown" title="以此面為底：點擊後再點模型上任一面，該面會轉向平台朝下">▼ 此面為底</button>
    <button class="abtn" id="btnOverhang" title="懸垂區域標色（依材料門檻）">⚠ 懸垂</button>
    <button class="abtn on" id="btnRange" title="顯示/隱藏成形範圍框">▦ 範圍框</button>
    <div class="vsep"></div>
    <button class="abtn" id="btnTheme" title="切換深色/淺色">◐</button>
  </div>
  <div style="flex:1"></div>
  <div id="cubeWrap">
    <div id="cube"><div id="cubeInner">
      <div class="cface" style="transform:translateZ(26px)" data-cam="front">前</div>
      <div class="cface" style="transform:rotateY(180deg) translateZ(26px)" data-cam="back">後</div>
      <div class="cface" style="transform:rotateY(90deg) translateZ(26px)" data-cam="right">右</div>
      <div class="cface" style="transform:rotateY(-90deg) translateZ(26px)" data-cam="left">左</div>
      <div class="cface" style="transform:rotateX(90deg) translateZ(26px)" data-cam="top">頂</div>
      <div class="cface" style="transform:rotateX(-90deg) translateZ(26px)" data-cam="bottom">底</div>
    </div></div>
    <button id="cubeHome" data-cam="home" title="回復視角">⌂</button>
  </div>
</div>
<div id="selBox"></div>
<div id="placePanel" class="glass"><div id="ppBody"></div></div>

<button id="stepShow" class="glass-sm" style="display:none">▶ 步驟面板</button>
<div id="stepCard" class="glass">
  <div id="stepHead"><b id="stepTitle">步驟 1 · 上傳檔案</b><span id="stepCount">1/5</span>
    <button id="stepHide">◀</button></div>
  <div id="stepBody"></div>
</div>

<div id="rail" class="glass">
  <button class="railBtn" data-mod="geo" title="幾何分析">🧩<small>幾何</small></button>
  <button class="railBtn" data-mod="fiber" title="纖維策略參考">🧵<small>纖維</small></button>
  <button class="railBtn" data-mod="cost" title="成本分析">💰<small>成本</small></button>
  <button class="railBtn" data-mod="admin" id="railAdmin" title="價格設定（限管理員／主管）" style="display:none">⚙<small>設定</small></button>
</div>
<div id="modPanel" class="glass">
  <div id="modHead"><b id="modTitle"></b><button id="modClose">✕</button></div>
  <div id="modBody"></div>
</div>

<div id="opHint" class="glass-sm">
  <b>左鍵</b> 選取／拖曳模型・拖旋轉環　·　<b>右鍵</b> 旋轉視角　·　<b>中鍵</b> 平移視角　·　<b>滾輪</b> 縮放
  <span id="selInfo" style="display:none;color:var(--accent);font-weight:700">　· 已選取模型</span>
</div>
<div id="busy"><div class="box">
  <div class="spin"></div><span id="busyMsg">處理中…</span>
</div></div>
<div id="toast"></div>
<div id="gate"><div class="box">
