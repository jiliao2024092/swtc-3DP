name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # ★ 移除 paths 過濾：任何 push 到 main 都觸發部署
    #   （之前的 paths 過濾會排除 portal/ 子資料夾的改動，導致不部署）
  workflow_dispatch:   # 也保留手動觸發選項

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ★ 只上傳前端會用到的檔案（2026-10-13）。原本 path: '.' 會把整個 repo 放上網站，
      #   CLAUDE.md、functions/main.py、docs/、tools/ 任何人都能直接用網址打開。
      #   前端只需要：根目錄的 *.html／*.js、favicon.ico、portal/ 資料夾。
      #   ⚠ 新增前端檔案若放在其他位置（例如新的資料夾或圖片），要加進下面的清單，否則網站上會 404。
      - name: Collect front-end files
        run: |
          mkdir _site
          cp *.html *.js favicon.ico _site/
          cp -r portal _site/portal
          echo "上傳到網站的檔案："
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ★ 同一份 _site 也部署到 Firebase Hosting（2026-10-13 起與 GitHub Pages 並行測試）。
      #   網址：https://swtc-3dp-poc.web.app/portal/portal.html
      #   設定刻意放在 firebase.hosting.json 而不是 firebase.json：後者列在
      #   deploy-functions.yml 的觸發條件裡，動它會白白重新部署一次 Cloud Function。
      #   排在 GitHub Pages 之後：這一步失敗時，GitHub Pages 已經更新完成，不受影響。
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA_JSON" > "$HOME/sa-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa-key.json"
          firebase deploy \
            --only hosting \
            --config firebase.hosting.json \
            --project swtc-3dp-poc \
            --non-interactive

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/sa-key.json"
