  fb.addEventListener('click', ()=>{
    S.faceDownMode = !S.faceDownMode;
    if (S.faceDownMode) toast('請點擊模型上任一面 — 該面將轉向平台朝下','warn');
    renderPlacePanel();
  });
  P.appendChild(fb);
  P.appendChild(el('div','ppHint','旋轉角度可於 ✨AI 面板數值輸入；拖出範圍框時框線與數值轉紅。'));
  $('#placePanel').classList.add('open');
}
/* 拖曳結束 → 提交位置並重算 */
async function commitModelDrag(){
  const m = activeModel(); if(!m || !m.mesh) return;
  pushUndo();
  m.pos.x += m.mesh.position.x;
  m.pos.z += m.mesh.position.z;
  m.mesh.position.set(0,0,0);
  // 移動使孤島/排液等標記位置失效 → 清除
  while (V.markGroup.children.length) disposeChild(V.markGroup);
  $('#legExtra').style.display='none';
  delete S.results.islands; delete S.results.cols; delete S.results.cupping;
  await rebuildScene(true);
  selectModel();
  logHist('手動擺放', `X ${F(m.pos.x,1)} / Y ${F(m.pos.z,1)} mm`);
}
/* 以此面為底：hit.face.normal（世界向）→ 額外旋轉使其朝下 */
async function applyFaceDown(hit){
  const m = activeModel(); if(!m) return;
  S.faceDownMode = false;
  pushUndo();
  const n = hit.face.normal.clone().normalize();
  const q2 = new THREE.Quaternion().setFromUnitVectors(n, new THREE.Vector3(0,-1,0));
  const eCur = new THREE.Euler(
    THREE.MathUtils.degToRad(S.orient.tiltX),
    THREE.MathUtils.degToRad(S.orient.yaw),
    THREE.MathUtils.degToRad(S.orient.tiltZ), 'XYZ');
  const qTot = q2.multiply(new THREE.Quaternion().setFromEuler(eCur));
  const eNew = new THREE.Euler().setFromQuaternion(qTot, 'XYZ');
  S.orient = {
    tiltX: Math.round(THREE.MathUtils.radToDeg(eNew.x)*10)/10,
    yaw:   Math.round(THREE.MathUtils.radToDeg(eNew.y)*10)/10,
    tiltZ: Math.round(THREE.MathUtils.radToDeg(eNew.z)*10)/10,
  };
  computeWorld(m); clampModelPos(m);
  // 硬性邊界（舊版行為）：轉正後若超出列印高度上限，整個動作強制還原
  if (m.worldBB.max[1] > mach().size[2] + 0.01){
    const prev = S.undoStack.pop();
    S.orient = prev.orient; m.pos = prev.pos;
    computeWorld(m);
    await rebuildScene(true); selectModel();
    toast('✕ 以此面為底後超出列印高度上限，動作已強制還原','err');
    return;
  }
  await rebuildScene(true);
  selectModel();
  toast('✓ 已將選取面轉向平台（以此面為底）','ok');
  logHist('以此面為底', `→ 傾X ${S.orient.tiltX}° / 側Y ${S.orient.yaw}° / 傾Z ${S.orient.tiltZ}°`);
}
/* 範圍框顏色與拖曳即時回饋 */
function modelFits(m, offX=0, offZ=0){
  if (!m || !m.worldBB) return true;
  const ms = mach().size;
  const bb = m.worldBB;
  return (bb.min[0]+offX >= -ms[0]/2-0.01) && (bb.max[0]+offX <= ms[0]/2+0.01) &&
         (bb.min[2]+offZ >= -ms[1]/2-0.01) && (bb.max[2]+offZ <= ms[1]/2+0.01) &&
         (bb.max[1] <= ms[2]+0.01);
}
function updateRangeBoxColor(){
  if (!V.rangeMat) return;
  const m = activeModel();
  const ok = !m || modelFits(m, m.mesh?m.mesh.position.x:0, m.mesh?m.mesh.position.z:0);
  V.rangeMat.color.set(ok ? 0x0c7a99 : 0xc0392b);
}
function liveRangeFeedback(m){ updateRangeBoxColor(); }

/* 機台/擺放變更時同步更新檢查報告中的「列印範圍」項 */
function refreshRangeCheck(m){
  if (!m || !m.fcheck) return;
  const it = m.fcheck.items.find(i=>i.label==='列印範圍');
  if (!it) return;
  const ms = mach().size;
  const fits = modelFits(m);
  it.status = fits ? 'pass' : 'fail';
  it.detail = `${F(m.worldBB.size[0],0)}×${F(m.worldBB.size[2],0)}×${F(m.worldBB.max[1],0)}mm / ${mach().name} ${ms[0]}×${ms[1]}×${ms[2]}mm${fits?'（已依目前機台/擺放同步）':' — <b>超出範圍</b>，請縮小、移動或換 Form 4L'}`;
  recountFcheck(m);
  if (S.step<=1) renderStep();
}
function recountFcheck(m){
  const FC = m.fcheck; if (!FC) return;
  FC.counts = {
    fail: FC.items.filter(i=>i.status==='fail').length,
    warn: FC.items.filter(i=>i.status==='warn').length,
    manual: FC.items.filter(i=>i.status==='manual').length,
    pass: FC.items.filter(i=>i.status==='pass').length,
  };
  FC.fixable = FC.items.filter(i=>i.fix==='repair' && i.status!=='pass').length;
  FC.verdict = FC.counts.fail ? 'fail' : FC.counts.warn ? 'warn' : 'pass';
}
/* 步驟3 進入後補算延後檢查（孤島／支撐合理性） */
async function updateDeferredChecks(m){
  if (!m || !m.fcheck) return;
  const hasDefer = m.fcheck.items.some(i=>i.status==='defer');
  if (!hasDefer) return;
  const IS = S.results.islands || await runIslands();
  const isl = m.fcheck.items.find(i=>i.label.includes('孤島'));
  if (isl){
    isl.status = IS.clusters.length ? 'warn' : 'pass';
    isl.kind = '近似';
    isl.detail = IS.clusters.length ? `<b>${IS.clusters.length} 處</b>孤島起點 — 已由支撐近似涵蓋,請以 PreForm 確認` : '未偵測孤島';
    isl.fix = IS.clusters.length ? 'islands' : null;
  }
  const sup = m.fcheck.items.find(i=>i.label.includes('支撐合理性'));
  if (sup){
    sup.status = S.supportStat ? 'pass' : 'warn';
    sup.kind = '近似';
    sup.detail = S.supportStat ? `${S.supportStat.points} 接觸點 · Ø${S.support.tp}mm · 密度 ${S.support.density} — 接觸面請人工確認未遮外觀面` : '支撐尚未生成';
    sup.fix = S.supportStat ? null : 'supports';
  }
  recountFcheck(m);
  toast(`✓ 已補算步驟3檢查：孤島 ${IS.clusters.length} 處 · 支撐 ${S.supportStat?S.supportStat.points+' 點':'未生成'}`, IS.clusters.length?'warn':'ok');
}
/* ============================== 25. 支撐材面板（對齊 PreForm 3.51+） ============================== */
function toggleSupPanel(open){
  const p = $('#supMatPanel');
  const want = (open===true) ? true : (open===false) ? false : !p.classList.contains('open');
  p.classList.toggle('open', want);
  $('#btnSupports').classList.toggle('on', want);
  if (want) renderSupPanel();
}
/* 數值微調器：▲▼ + 滾輪 + ↺恢復預設 */
function mkSpin(label, get, set, opt={}){
  const { step=0.05, unit='mm', dec=2, def=null, min=0.05, max=999 } = opt;
  const row = el('div','pRow');
  row.appendChild(el('label','', label));
  const rst = el('span','reset', '↺'); rst.title='恢復預設';
  const box = el('div','spinB',
    `<input value="${F(get(),dec)}">${unit?`<span class="un">${unit}</span>`:''}<div class="ar"><button>▲</button><button>▼</button></div>`);
  const inp = box.querySelector('input');
  const [up,dn] = box.querySelectorAll('.ar button');
  const sync = ()=>{ inp.value = F(get(),dec); rst.classList.toggle('hid', def===null || Math.abs(get()-def) < 1e-9); };
  const commit = async v => {
    v = Math.min(max, Math.max(min, +v||0));
    set(Math.round(v/step)*step*1 || v);
    set(v);
    sync();
    if (supportsActive() && S.supportsOn) await rebuildScene(true);
    if ($('#supMatPanel').classList.contains('open')) { /* 保持面板 */ }
    updateAllUI();
  };
  inp.addEventListener('change', ()=>commit(inp.value));
  up.addEventListener('click', ()=>commit(get()+step));
  dn.addEventListener('click', ()=>commit(get()-step));
  inp.addEventListener('wheel', ev=>{ ev.preventDefault(); commit(get() + (ev.deltaY<0?step:-step)); }, {passive:false});
  rst.addEventListener('click', ()=>{ if(def!==null) commit(def); });
  row.appendChild(rst); row.appendChild(box);
  sync();
  return row;
}
function renderSupPanel(){
  const P = S.sup, D = SUP_DEFAULTS;
  const B = $('#smBody'); B.innerHTML='';
  /* 標題列：顯示/隱藏眼睛 + 關閉 */
  const head = el('div','smHead',
    `支撐材 <span style="flex:1"></span>
     <span class="hbtn ${S.supportsOn?'':'eyeOff'}" id="smEye" title="顯示/隱藏支撐">${S.supportsOn?'👁':'🚫'}</span>
     <span class="hbtn" id="smX">✕</span>`);
  head.querySelector('#smEye').addEventListener('click', ()=>{
    S.supportsOn = !S.supportsOn;
    V.supGroup.visible = S.supportsOn;
    renderSupPanel();
  });
  head.querySelector('#smX').addEventListener('click', ()=>toggleSupPanel(false));
  B.appendChild(head);

  /* ── 接觸點位置 ── */
  B.appendChild(el('div','smSec','接觸點位置'));
  const body1 = el('div','smBody');
  const tabs1 = el('div','smTabs','<button class="on">自動放置</button><button disabled title="下一階段提供">手動放置</button>');
  body1.appendChild(tabs1);
  const pre = el('div','smPre','<button>預設</button><button>低密度</button><button>小接觸點</button>');
  const [pd, pl, ps] = pre.querySelectorAll('button');
  const reGen = async ()=>{ if (supportsActive()) await rebuildScene(true); renderSupPanel(); if (S.step===2) renderStep(); };
  pd.addEventListener('click', async ()=>{ S.sup = cloneSup(); await reGen(); });
  pl.addEventListener('click', async ()=>{ S.sup.over.density = 0.6; await reGen(); });
  ps.addEventListener('click', async ()=>{ S.sup.tpSize = 0.35; await reGen(); });
  body1.appendChild(pre);
  body1.appendChild(mkSpin('接觸點尺寸', ()=>P.tpSize, v=>{P.tpSize=v;}, {step:0.05, def:D.tpSize, min:0.1, max:2.0}));
  /* 四類（PreForm 色碼）：懸空點/懸空/穩定化/強化 */
  const typeBox = (cls, key, title, subBuild)=>{
    const box = el('div','typeBox '+cls);
    const th = el('div','th', `<input type="checkbox" ${P[key].on?'checked':''}> ${title}`);
    th.querySelector('input').addEventListener('change', async e=>{ P[key].on = e.target.checked; await reGen(); });
    box.appendChild(th);
    if (P[key].on && subBuild){ const sub = el('div','sub'); subBuild(sub); box.appendChild(sub); }
    return box;
  };
  body1.appendChild(typeBox('tb-minima','minima','⌄ 懸空點（最低點）', null));
  body1.appendChild(typeBox('tb-over','over','▿ 懸空', sub=>{
    sub.appendChild(mkSpin('密度', ()=>P.over.density, v=>{P.over.density=v;}, {step:0.1, unit:'', def:D.over.density, min:0.1, max:2.5}));
    sub.appendChild(mkSpin('角度（與水平夾角）', ()=>P.over.angle, v=>{P.over.angle=v;}, {step:1, unit:'°', dec:1, def:D.over.angle, min:1, max:60}));
  }));
  body1.appendChild(typeBox('tb-stab','stab','⌒ 穩定化（最低點周圍）', sub=>{
    sub.appendChild(mkSpin('密度', ()=>P.stab.density, v=>{P.stab.density=v;}, {step:0.1, unit:'', def:D.stab.density, min:0, max:2.5}));
  }));
  body1.appendChild(typeBox('tb-rein','rein','⌐ 強化（沿本體）', sub=>{
    sub.appendChild(mkSpin('密度', ()=>P.rein.density, v=>{P.rein.density=v;}, {step:0.1, unit:'', def:D.rein.density, min:0, max:2.5}));
  }));
  B.appendChild(body1);

  /* ── 支撐材結構 ── */
  B.appendChild(el('div','smSec','支撐材結構'));
  const body2 = el('div','smBody');
  const tabs2 = el('div','smTabs',
    `<button data-t="tp"${S.supTab==='tp'?' class="on"':''}>接觸點</button>
     <button data-t="pil"${S.supTab==='pil'?' class="on"':''}>支柱</button>
     <button data-t="raft"${S.supTab==='raft'?' class="on"':''}>底座（網格層）</button>`);
  tabs2.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ S.supTab=b.dataset.t; renderSupPanel(); }));
  body2.appendChild(tabs2);
  if (S.supTab==='tp'){
    body2.appendChild(mkSpin('齒長最小值', ()=>P.tpS.toothLenMin, v=>{P.tpS.toothLenMin=v;}, {step:0.1, def:D.tpS.toothLenMin, min:0.3, max:6}));
    const it = el('label','smTgl',`<span>允許模型上的內部支撐</span><input type="checkbox" ${P.tpS.internal?'checked':''}>`);
    it.querySelector('input').addEventListener('change', async e=>{ P.tpS.internal=e.target.checked; await reGen(); });
    body2.appendChild(it);
    if (P.tpS.internal){
      body2.appendChild(mkSpin('內部支撐底部直徑', ()=>P.tpS.iBotDia, v=>{P.tpS.iBotDia=v;}, {step:0.05, def:D.tpS.iBotDia, min:0.3, max:4}));
      body2.appendChild(mkSpin('齒數上限', ()=>P.tpS.teethMax, v=>{P.tpS.teethMax=Math.round(v);}, {step:1, unit:'', dec:0, def:D.tpS.teethMax, min:1, max:8}));
    }
  } else if (S.supTab==='pil'){
    const sr = el('div','pRow');
    sr.appendChild(el('label','','結構類型'));
    const sel = el('select','smSel','<option value="classic">經典</option><option value="lattice" disabled>晶格（下一階段）</option>');
    sel.value = P.pil.structure;
    sel.addEventListener('change', ()=>{ P.pil.structure = sel.value; });
    sr.appendChild(sel);
    body2.appendChild(sr);
    body2.appendChild(mkSpin('頂部桁架寬度', ()=>P.pil.topTrussW, v=>{P.pil.topTrussW=v;}, {step:0.01, def:D.pil.topTrussW, min:0.2, max:3}));
    body2.appendChild(mkSpin('桁架寬度', ()=>P.pil.trussW, v=>{P.pil.trussW=v;}, {step:0.01, def:D.pil.trussW, min:0.2, max:3}));
    body2.appendChild(mkSpin('桁架高度', ()=>P.pil.trussH, v=>{P.pil.trussH=v;}, {step:0.05, def:D.pil.trussH, min:0.3, max:5}));
    body2.appendChild(mkSpin('細繫支撐柱上部直徑', ()=>P.pil.tTopDia, v=>{P.pil.tTopDia=v;}, {step:0.05, def:D.pil.tTopDia, min:0.4, max:5}));
    body2.appendChild(mkSpin('細繫支撐柱下部直徑', ()=>P.pil.tBotDia, v=>{P.pil.tBotDia=v;}, {step:0.05, def:D.pil.tBotDia, min:0.4, max:6}));
    body2.appendChild(mkSpin('細繫處與模型的距離', ()=>P.pil.trussDist, v=>{P.pil.trussDist=v;}, {step:0.5, def:D.pil.trussDist, min:1, max:20}));
    body2.appendChild(mkSpin('未細繫支撐柱直徑', ()=>P.pil.uDia, v=>{P.pil.uDia=v;}, {step:0.05, def:D.pil.uDia, min:0.3, max:4}));
    const bt = el('label','smTgl',`<span>捆綁式支撐材</span><input type="checkbox" ${P.pil.bundled?'checked':''}>`);
    bt.querySelector('input').addEventListener('change', async e=>{ P.pil.bundled=e.target.checked; await reGen(); });
    body2.appendChild(bt);
  } else {
    const rr = el('div','pRow');
    rr.appendChild(el('label','','底座類型'));
    const sel = el('select','smSel','<option value="full">完整</option><option value="mini">迷你</option><option value="none">無</option>');
    sel.value = P.raft.type;
    sel.addEventListener('change', async ()=>{ P.raft.type = sel.value; const m=activeModel(); if(m){computeWorld(m);} await reGen(); });
    rr.appendChild(sel);
    body2.appendChild(rr);
    if (P.raft.type!=='none'){
      body2.appendChild(mkSpin('底座厚度', ()=>P.raft.thickness, v=>{P.raft.thickness=v;}, {step:0.1, def:D.raft.thickness, min:0.5, max:6}));
    }
    body2.appendChild(mkSpin('底座上方高度', ()=>P.raft.heightAbove, v=>{P.raft.heightAbove=v;}, {step:0.5, def:D.raft.heightAbove, min:1, max:15}));
    if (P.raft.type==='mini'){
      body2.appendChild(mkSpin('迷你底座半徑', ()=>P.raft.miniR, v=>{P.raft.miniR=v;}, {step:0.5, def:D.raft.miniR, min:2, max:12}));
      body2.appendChild(mkSpin('合併距離', ()=>P.raft.mergeDist, v=>{P.raft.mergeDist=v;}, {step:0.5, def:D.raft.mergeDist, min:2, max:20}));
    }
    if (P.raft.type==='full'){
      const lt = el('label','smTgl',`<span>底座標籤（模型名稱）</span><input type="checkbox" ${P.raft.label?'checked':''}>`);
      lt.querySelector('input').addEventListener('change', async e=>{ P.raft.label=e.target.checked; await reGen(); });
      body2.appendChild(lt);
    }
  }
  B.appendChild(body2);

  /* ── 統計摘要（同 PreForm 總結分計）── */
  if (S.supportStat){
    const st = S.supportStat, bt = st.byType||{};
    const body3 = el('div','smBody');
    body3.appendChild(el('div','mnote',
      `接觸點 <b>${st.points}</b>（<span style="color:#e8930c">懸空點 ${bt.minima||0}</span> · <span style="color:#0d9488">懸空 ${bt.over||0}</span> · <span style="color:#d6409f">穩定化 ${bt.stab||0}</span> · <span style="color:#46a758">強化 ${bt.rein||0}</span>）<br>支撐材 <b>${F(st.volSupMM3/1000,2)} mL</b> · 基底 <b>${F(st.volRaftMM3/1000,2)} mL</b> · 桁架 ${st.braces}`));
    B.appendChild(body3);
  }

  /* ── 誠實標示 ── */
  B.appendChild(el('div','smNote',
    `<b>誠實標示：</b>參數名稱、預設值與行為語意對齊 <b>PreForm 3.51+（Supports V1／經典）</b>；幾何由內建近似引擎依參數生成並依類型上色，<b>非 PreForm 演算法重現</b> — 相同「密度」兩邊點數不會一致。100% 相同請於 ☁ 雲端面板切換 PFS 模式。晶格(V2)與手動放置為下一階段。`));

  /* ── 動作 ── */
  const foot = el('div','smFoot','<button class="gen">自動生成所有</button><button class="clr">全部清除</button>');
  foot.querySelector('.gen').addEventListener('click', async ()=>{
    S.supportsOn = true;
    if (S.step < 2){ S.forceSupports = true; toast('已於步驟外強制生成支撐（進入步驟3前僅供預覽）','warn'); }
    const m = activeModel(); if (m) computeWorld(m);
    await rebuildScene(true);
    renderSupPanel();
  });
  foot.querySelector('.clr').addEventListener('click', async ()=>{
    S.supportsOn = false; S.forceSupports = false;
    const m = activeModel(); if (m) computeWorld(m);
    await rebuildScene(true);
    renderSupPanel();
  });
  B.appendChild(foot);
}
