<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Print Studio · 3D列印估價（沉浸版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg1:#ffffff; --bg2:#f6f8fa;
  --glass:rgba(255,255,255,.9); --glass2:rgba(255,255,255,.85);
  --line:#e6e8ec; --lineGlass:rgba(230,232,236,.95);
  --ink:#0a0e14; --ink2:#3b4250; --ink3:#5a6270; --ink4:#8a93a3;
  --accent:#0c7a99; --accentBg:#e6f1f6;
  --ok:#1d6f43; --okBg:#e6f1ea; --okLine:#b6d9c4;
  --warn:#c79b2a; --err:#c0392b; --purple:#7b5ec7; --purpleBg:#efeafb;
  --mono:'JetBrains Mono',monospace;
  --shadow:0 10px 32px rgba(10,14,20,.12);
  --shadowSm:0 4px 16px rgba(10,14,20,.08);
  --panelBg:#ffffff;
}
:root[data-theme="dark"]{
  --bg1:#12151b; --bg2:#0a0d12;
  --glass:rgba(24,28,36,.9); --glass2:rgba(24,28,36,.85);
  --line:#2a2f3a; --lineGlass:rgba(42,47,58,.95);
  --ink:#eef1f5; --ink2:#c3c9d4; --ink3:#9aa2b0; --ink4:#6b7280;
  --accent:#3fb6d8; --accentBg:#173540;
  --ok:#4bcf8b; --okBg:#123a29; --okLine:#1f5c40;
  --warn:#e0b64a; --err:#e0605a; --purple:#a68af0; --purpleBg:#251c40;
  --shadow:0 10px 32px rgba(0,0,0,.4);
  --shadowSm:0 4px 16px rgba(0,0,0,.3);
  --panelBg:#1b1f27;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2));
  font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);font-size:calc(14px * var(--fs));
}
button{font-family:inherit}
#c3d{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--lineGlass);border-radius:12px;box-shadow:var(--shadow)}
.glass-sm{background:var(--glass2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(230,232,236,.9);box-shadow:var(--shadowSm)}
.mono{font-family:var(--mono)}
.lbl{font-size:calc(9.5px * var(--fs));font-weight:600;font-family:var(--mono);color:var(--ink4);
  text-transform:uppercase;letter-spacing:.07em;margin:10px 0 5px}
.lbl:first-child{margin-top:0}

/* ============ top bar ============ */
#topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:flex-start;gap:8px;pointer-events:none;z-index:20}
#topbar>*{pointer-events:auto}
#brand{display:flex;align-items:center;gap:8px;border-radius:8px;padding:7px 12px}
#brand b{font-size:calc(13.5px * var(--fs))}
#brand .tag{height:17px;padding:0 8px;font-size:calc(10px * var(--fs));border-radius:999px;font-family:var(--mono);
  font-weight:600;background:var(--accentBg);color:var(--accent);display:inline-flex;align-items:center}
#viewbar{display:flex;gap:5px;border-radius:8px;padding:5px;align-items:center}
.vtab{padding:4px 10px;border-radius:5px;border:1px solid transparent;font-size:calc(11px * var(--fs));font-weight:600;
  color:var(--ink4);cursor:pointer;background:transparent}
.vtab.on{border-color:var(--line);color:var(--ink);background:var(--panelBg)}
.vsep{width:1px;background:var(--line);align-self:stretch;margin:2px 2px}
.abtn{padding:4px 9px;border-radius:5px;border:1px solid var(--line);font-size:calc(11px * var(--fs));cursor:pointer;background:var(--panelBg);color:var(--ink3)}
.abtn.warnb{border-color:var(--warn);color:var(--warn)}
.abtn.warnb.on{background:#faf3df}
.abtn.purpleb{border-color:var(--purple);color:var(--purple);background:var(--purpleBg)}
.abtn.on{box-shadow:inset 0 0 0 1px currentColor}

/* view cube */
#cubeWrap{display:flex;flex-direction:column;gap:5px;align-items:center}
#cube{width:52px;height:52px;perspective:200px}
#cubeInner{transform-style:preserve-3d;transform:rotateX(-22deg) rotateY(-38deg);width:52px;height:52px;position:relative;transition:transform .18s}
.cface{position:absolute;width:52px;height:52px;display:flex;align-items:center;justify-content:center;
  font-size:calc(11px * var(--fs));font-weight:600;color:var(--ink3);background:rgba(255,255,255,.92);border:1px solid var(--line);cursor:pointer;user-select:none}
.cface:hover{background:var(--accentBg);color:var(--accent)}
#cubeHome{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);font-size:calc(11px * var(--fs));cursor:pointer;color:var(--ink3)}

/* ============ left step card ============ */
#stepCard{position:absolute;top:80px;left:14px;width:calc(262px * var(--fs));max-height:calc(100vh - 175px);
  overflow-y:auto;padding:14px;z-index:15}
#stepCard::-webkit-scrollbar{width:5px}
#stepCard::-webkit-scrollbar-thumb{background:#cfd6dd;border-radius:3px}
#stepHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px}
#stepHead b{font-size:calc(13px * var(--fs));flex:1}
#stepHead span{font-size:calc(10px * var(--fs));color:var(--ink4);font-family:var(--mono)}
#stepHide{border:1px solid var(--line);background:var(--panelBg);border-radius:5px;width:22px;height:22px;cursor:pointer;color:var(--ink3);font-size:calc(10px * var(--fs));flex-shrink:0}
#stepHide:hover{color:var(--accent);border-color:var(--accent)}
#stepShow{position:absolute;top:80px;left:14px;z-index:15;padding:8px 11px;border-radius:8px;cursor:pointer;font-size:calc(11.5px * var(--fs));font-weight:600;color:var(--ink3)}
#stepShow:hover{color:var(--accent)}

.fileRow{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--panelBg);margin-bottom:5px;cursor:pointer}
.fileRow.on{border-color:var(--accent);background:var(--accentBg)}
.fileRow .fname{font-size:calc(11.5px * var(--fs));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileRow .fmeta{font-size:calc(9px * var(--fs));color:var(--ink4);font-family:var(--mono)}
.fileRow .fx{font-size:calc(10px * var(--fs));color:var(--ink4);cursor:pointer;padding:2px 4px}
.fileRow .fx:hover{color:var(--err)}
#dropZone{border:1.5px dashed var(--accent);border-radius:7px;padding:12px 6px;text-align:center;background:var(--accentBg);display:block;margin-top:6px;cursor:pointer}
#dropZone .ic{font-size:calc(16px * var(--fs))}
#dropZone .t1{font-size:calc(10px * var(--fs));color:var(--ink3);margin-top:2px}
#dropZone .t2{font-size:calc(9.5px * var(--fs));color:var(--ink4);font-family:var(--mono)}
#dropZone.drag{background:#d3ecf5;border-color:#0a6a86}

.machRow{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--panelBg);cursor:pointer;margin-bottom:4px}
.machRow.on{border-color:var(--accent);background:var(--accentBg)}
.machRow .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex-shrink:0}
.machRow.on .dot{background:var(--accent)}
.machRow .mname{font-size:calc(12px * var(--fs));font-weight:600}
.machRow .mdim{font-size:calc(9.5px * var(--fs));color:var(--ink4);font-family:var(--mono)}

.okNote{font-size:calc(10px * var(--fs));padding:6px 9px;border-radius:6px;background:var(--okBg);border:1px solid var(--okLine);color:var(--ok);font-weight:600;margin-top:6px}
.errNote{font-size:calc(10px * var(--fs));padding:6px 9px;border-radius:6px;background:#faecec;border:1px solid #ecc9c9;color:var(--err);font-weight:600;margin-top:6px}

select.sel{width:100%;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panelBg);color:var(--ink2);font:inherit;font-size:calc(12px * var(--fs))}
.selMeta{font-size:calc(9.5px * var(--fs));color:var(--ink4);font-family:var(--mono);margin-top:3px}

.segGrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.segRow{display:flex;gap:4px}
.seg{flex:1;padding:6px 3px;border-radius:5px;border:1px solid var(--line);background:var(--panelBg);color:var(--ink3);font-size:calc(10.5px * var(--fs));font-weight:600;cursor:pointer}
.seg.mono{font-family:var(--mono)}
.seg.on{border-color:var(--ink);background:var(--ink);color:#fff}
.seg.onA{border-color:var(--accent);background:var(--accent);color:#fff}

.sliderRow{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.sliderRow .sl{font-size:calc(11px * var(--fs));color:var(--ink3);width:60px;flex-shrink:0}
.sliderRow input[type=range]{flex:1;height:3px;accent-color:var(--accent)}
.sliderRow .sv{font-size:calc(10px * var(--fs));font-family:var(--mono);width:40px;text-align:right;font-weight:600}

.bigBtn{width:100%;padding:8px;border-radius:6px;background:var(--accent);color:#fff;border:0;font:inherit;font-size:calc(12px * var(--fs));font-weight:600;cursor:pointer}
.bigBtn:hover{background:#0a6a86}
.bigBtn:disabled{background:#9db8c2;cursor:not-allowed}
.ghostBtn{width:100%;padding:7px;border-radius:6px;background:var(--panelBg);color:var(--ink3);border:1px solid var(--line);font:inherit;font-size:calc(11.5px * var(--fs));font-weight:600;cursor:pointer}
.ghostBtn:hover{border-color:var(--accent);color:var(--accent)}

.chk{border:1px solid #eef0f3;border-left:3px solid var(--ink4);background:var(--panelBg);border-radius:4px;padding:5px 8px;margin-bottom:4px}
.chk.err{border-left-color:var(--err)}
.chk.warn{border-left-color:var(--warn)}
.chk .t{font-size:calc(10.5px * var(--fs));font-weight:600}
.chk .t small{font-size:calc(8.5px * var(--fs));color:var(--ink4);font-weight:400;font-family:var(--mono)}
.chk .d{font-size:calc(9px * var(--fs));color:var(--ink4)}
.chk .act{color:var(--accent);cursor:pointer;text-decoration:underline}
#passBar{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:var(--okBg);border:1px solid var(--okLine);border-radius:5px;font-size:calc(10.5px * var(--fs));font-weight:600;color:var(--ok);cursor:pointer}
#passChips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.pchip{font-size:calc(9px * var(--fs));padding:2px 7px;border-radius:999px;background:var(--panelBg);border:1px solid #cde3d6;color:var(--ok);cursor:default}

/* ============ 檔案檢查報告（步驟1 下方） ============ */
.fcVerdict{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;margin-bottom:7px}
.fcVerdict .vic{width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:calc(14px * var(--fs));font-weight:700;flex-shrink:0}
.fcVerdict .vt{font-size:calc(12px * var(--fs));font-weight:700}
.fcVerdict .vd{font-size:calc(9.5px * var(--fs));color:var(--ink3);margin-top:1px}
.fcVerdict.fcv-err{background:#fbe7e3;border:1px solid #ecc9c9}
.fcVerdict.fcv-err .vic{background:var(--err);animation:fcpulse 1.6s infinite}
.fcVerdict.fcv-err .vt{color:var(--err)}
.fcVerdict.fcv-warn{background:#fbf3dc;border:1px solid #ecdcae}
.fcVerdict.fcv-warn .vic{background:var(--warn)}
.fcVerdict.fcv-warn .vt{color:#8b6b13}
.fcVerdict.fcv-ok{background:var(--okBg);border:1px solid var(--okLine)}
.fcVerdict.fcv-ok .vic{background:var(--ok)}
.fcVerdict.fcv-ok .vt{color:var(--ok)}
@keyframes fcpulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.35)}50%{box-shadow:0 0 0 7px rgba(192,57,43,0)}}
.fcCounts{display:flex;gap:4px;margin-bottom:8px}
.fcCnt{flex:1;text-align:center;padding:5px 2px;border-radius:6px;border:1px solid var(--line);background:var(--panelBg)}
.fcCnt b{display:block;font-size:calc(15px * var(--fs));font-family:var(--mono)}
.fcCnt span{font-size:calc(8.5px * var(--fs));color:var(--ink4);font-weight:600}
.fcCnt.e{border-color:#ecc9c9;background:#fbe7e3} .fcCnt.e b{color:var(--err)}
.fcCnt.w{border-color:#ecdcae;background:#fbf3dc} .fcCnt.w b{color:var(--warn)}
.fcCnt.m b{color:var(--purple)}
.fcCnt.p{border-color:var(--okLine);background:var(--okBg)} .fcCnt.p b{color:var(--ok)}
.fcSec{font-size:calc(9.5px * var(--fs));font-weight:700;color:var(--ink3);margin:8px 0 4px;display:flex;align-items:center;gap:5px}
.fcBadge{font-size:calc(8px * var(--fs));font-family:var(--mono);font-weight:700;padding:0 6px;border-radius:999px}
.fcBadge.e{background:var(--err);color:#fff}
.fcheck .chk{border-left-width:4px}
.fcheck .chk .d b{font-family:var(--mono)}
.fcheck .chk.err{border-left-color:var(--err);background:linear-gradient(90deg,#fbe7e3,#fff 60%);
  box-shadow:0 2px 8px rgba(192,57,43,.14);position:relative}
.fcheck .chk.err .t{color:var(--err)}
.fcheck .chk.err::after{content:'需處理';position:absolute;top:6px;right:8px;font-size:calc(8px * var(--fs));font-weight:700;
  color:#fff;background:var(--err);padding:1px 7px;border-radius:999px}
.fcheck .chk.warn{border-left-color:var(--warn);background:linear-gradient(90deg,#fbf3dc,#fff 60%)}
.fcheck .chk.warn .t{color:#8b6b13}
.fcheck .chk.manual{border-left-color:var(--purple)}
.fcFix{font-size:calc(9.5px * var(--fs));color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;white-space:nowrap}
.fcPassBar{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;background:var(--okBg);
  border:1px solid var(--okLine);border-radius:6px;font-size:calc(10.5px * var(--fs));font-weight:700;color:var(--ok);cursor:pointer;margin-top:6px}
.fcChips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
/* 延後檢查項（步驟3 才計算） */
.fcheck .chk.defer{border-left-color:var(--ink4);background:#f6f8fa}
.fcheck .chk.defer .t{color:var(--ink4)}

/* ============ 擺放面板（PreForm 式） ============ */
#placePanel{position:absolute;top:80px;right:72px;width:calc(218px * var(--fs));padding:12px;z-index:17;display:none}
#placePanel.open{display:block}
#placePanel h4{font-size:calc(12px * var(--fs));display:flex;justify-content:space-between;align-items:center}
#placePanel h4 .x{color:var(--ink4);cursor:pointer;font-weight:400}
.ppHint{font-size:calc(9px * var(--fs));color:var(--ink4);line-height:1.6;margin-top:5px}
.ppHint b{color:var(--ink2)}
.arrowPad{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:8px}
.arrowPad button{padding:6px 0;border-radius:5px;border:1px solid var(--line);background:var(--panelBg);color:var(--ink3);font-size:calc(11px * var(--fs));font-weight:700;cursor:pointer}
.arrowPad button:hover{border-color:var(--accent);color:var(--accent)}
.arrowPad button.c{background:var(--accent);color:#fff;border-color:var(--accent)}
.arrowPad .empty{visibility:hidden}
.ppFace{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:7px;margin-top:8px;
  border-radius:6px;border:1.5px solid var(--accent);background:var(--panelBg);color:var(--accent);
  font:inherit;font-size:calc(11.5px * var(--fs));font-weight:700;cursor:pointer}
.ppFace.on{background:var(--accent);color:#fff}
#placePanel .inRow input.outR{border-color:var(--err);color:var(--err)}

/* ============ 大字模式 ============ */
:root{--fs:1}
body.big{--fs:1.16}
#btnFs.on{border-color:var(--accent);color:var(--accent);background:var(--accentBg)}

/* ============ 旋轉角度提示（PreForm 式弧形角度顯示） ============ */
#gizmoTip{position:fixed;z-index:90;display:none;background:#0a0e14;color:#fff;
  font:700 calc(11px * var(--fs)) var(--mono);padding:4px 10px;border-radius:6px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}
#gizmoTip small{color:#9fdcee;font-weight:400}

/* ============ 自動擺放目標與差異說明 ============ */
.goalSeg{flex:1;padding:6px 3px;border-radius:6px;border:1px solid var(--line);background:var(--panelBg);
  color:var(--ink3);font-size:calc(10px * var(--fs));font-weight:700;text-align:center;cursor:pointer;line-height:1.35}
.goalSeg small{display:block;font-size:calc(7.5px * var(--fs));font-weight:400;color:var(--ink4)}
.goalSeg.on{border-color:var(--accent);background:var(--accent);color:#fff}
.goalSeg.on small{color:rgba(255,255,255,.8)}
.diffBox{border:1px solid #ecdcae;background:#fbf3dc;border-radius:7px;padding:8px 10px;margin-top:8px}
.diffBox .t{font-size:calc(10.5px * var(--fs));font-weight:700;color:#8b6b13}
.diffBox .d{font-size:calc(9px * var(--fs));color:var(--ink3);line-height:1.6;margin-top:3px}
.diffBox .d b{color:var(--ink2)}
.pfsRow{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--panelBg);margin-top:6px;
  font-size:calc(9.5px * var(--fs));color:var(--ink3);line-height:1.55}
.pfsRow b{color:var(--accent)}

/* ============ 支撐材面板（對齊 PreForm 3.51+） ============ */
#supMatPanel{position:absolute;top:80px;left:calc(282px * var(--fs) + 22px);width:calc(300px * var(--fs));
  max-height:calc(100vh - 175px);overflow-y:auto;background:var(--panelBg);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 36px rgba(10,14,20,.16);z-index:18;display:none}
#supMatPanel.open{display:block}
#supMatPanel::-webkit-scrollbar{width:5px}
#supMatPanel::-webkit-scrollbar-thumb{background:#cfd6dd;border-radius:3px}
.smHead{display:flex;justify-content:space-between;align-items:center;padding:11px 14px 7px;font-size:calc(13.5px * var(--fs));font-weight:700}
.smHead .hbtn{color:var(--ink4);cursor:pointer;font-weight:400;font-size:calc(13px * var(--fs));margin-left:8px}
.smHead .hbtn.eyeOff{color:var(--err)}
.smSec{font-size:calc(10.5px * var(--fs));font-weight:700;color:var(--ink2);background:#f3f5f7;padding:6px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.smBody{padding:10px 14px}
.smTabs{display:flex;border:1.5px solid var(--accent);border-radius:6px;overflow:hidden;margin-bottom:9px}
.smTabs button{flex:1;padding:6px 2px;border:0;background:var(--panelBg);color:var(--accent);font:inherit;font-size:calc(10.5px * var(--fs));font-weight:700;cursor:pointer}
.smTabs button.on{background:var(--accent);color:#fff}
.smTabs button:disabled{color:var(--ink4);cursor:not-allowed}
.pRow{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.pRow>label{flex:1;font-size:calc(10.5px * var(--fs));color:var(--ink2);line-height:1.3}
.pRow .reset{font-size:calc(10px * var(--fs));color:var(--accent);cursor:pointer;width:14px;text-align:center}
.pRow .reset.hid{visibility:hidden}
.spinB{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panelBg)}
.spinB input{width:calc(52px * var(--fs));height:24px;border:0;padding:0 5px;font:calc(10.5px * var(--fs)) var(--mono);text-align:right;color:var(--ink);outline:none}
.spinB .un{font-size:calc(8.5px * var(--fs));color:var(--ink4);padding-right:4px;font-family:var(--mono)}
.spinB .ar{display:flex;flex-direction:column;border-left:1px solid var(--line)}
.spinB .ar button{width:15px;height:12px;border:0;background:var(--panelBg);font-size:7px;color:var(--ink3);cursor:pointer;line-height:1;padding:0}
.spinB .ar button:hover{color:var(--accent)}
.typeBox{border:1.5px solid;border-radius:7px;padding:6px 9px;margin-bottom:6px}
.typeBox .th{display:flex;align-items:center;gap:6px;font-size:calc(11px * var(--fs));font-weight:700;cursor:pointer}
.typeBox .th input{accent-color:var(--accent)}
.typeBox .sub{margin-top:5px;padding-left:20px}

</head>

<script>
"use strict";
/* =========================================================================
   AI Print Studio — 3D列印估價（沉浸版）完整功能
   模組：STL分析(修復/水密/厚度/曲率) · 列印分析(懸空/孤島/支撐/翹曲/收縮)
        AI最佳化(擺放/支撐/材料/層厚) · 成本分析(材料/電費/工時/利潤)
        雲端管理(工單/歷史/AI報告/API)
   註：支撐與孤島等列印分析為「內建近似演算法」(取樣+射線法)，
       非 PreForm 重現；精確結果請切換 PFS API 模式 (localhost:44389)。
   ========================================================================= */
/* ============================================================
   0. Firebase 設定與雲端同步（已接上 swtc-3dp-poc 平台）
   Collections：
     print_orders          — 本工具產生的列印估價工單
     print_history         — 本工具的操作歷史紀錄
     settings/quote_materials — 材料清單（與 quote.html「材料設定」共用同一份）
   登入沿用入口網站（portal）的帳號 session：同網域下 Firebase Auth
   自動共用，未登入者顯示提示並擋下操作（與 quote.html 相同模式）。
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyB-bFYMZPkqZenFWmFxEExxb4iVUz3Pz_k",
  authDomain:        "swtc-3dp-poc.firebaseapp.com",
  projectId:         "swtc-3dp-poc",
  storageBucket:     "swtc-3dp-poc.firebasestorage.app",
  messagingSenderId: "1074210451221",
  appId:             "1:1074210451221:web:quote"
};
const FB = { ready:false, db:null, uid:null, unsubOrders:null, unsubHistory:null };

// 全螢幕檢視：本頁以 iframe 嵌在 portal.html 裡時，隱藏 portal 左側選單(.shell-sidebar)讓本頁填滿整個
// 瀏覽器視窗；刻意不用原生 Fullscreen API，因為那會連瀏覽器書籤列都蓋掉，使用者要求保留書籤列/工作列。
// 同源 iframe 才能直接摸到 parent DOM，非iframe/跨網域環境下靜默略過（本頁本身已是滿版版面，不受影響）。
function setPortalSidebarHidden(hidden){
  try{
    if(window.parent === window) return;
    const sidebar = window.parent.document.querySelector('.shell-sidebar');
    if(sidebar) sidebar.style.display = hidden ? 'none' : '';
  }catch(e){ /* 跨網域或其他限制時靜默忽略 */ }
}
function genNo(prefix){
  const d = new Date().toISOString().slice(2,10).replace(/-/g,'');
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return `${prefix}-${d}-${rand}`;
}

async function initFirebaseSync(){
  if (typeof firebase === 'undefined'){
    console.warn('[FB] SDK 未載入，改用本機模式'); setCloudStatus('offline'); return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    FB.db = firebase.firestore();
    // 沿用入口網站(portal)的登入 session（同網域自動共用），不做匿名登入。
    // 未登入＝整頁擋下，與 quote.html 相同模式。

      if (!u){

/* 材料清單改讀 Firestore settings/quote_materials（與 quote.html「材料設定」共用同一份）。
   欄位對應：{name, code, price, density} → {id:code, name, priceL:price, density, ...}；
   shrink/layers/tags 為本頁估算引擎需要、Firestore 未存的欄位，套用通用預設值。
   讀取失敗或清單為空時，保留內建預設材料（本頁仍可離線估價）。 */
async function loadCloudMaterials(){
  try {
    const doc = await FB.db.collection('settings').doc('quote_materials').get();
    const list = doc.exists ? (doc.data().list || []) : [];
    if (!list.length) return;
    const mapped = list.map(x => ({
      id: x.code || x.name,
      name: x.name || x.code,
      priceL: +x.price || 3000,
      density: +x.density || 1.10,
      shrink: 0.35,
      layers: [0.025, 0.05, 0.1],
      tags: [],
      note: x.code || '',
    }));
    MATERIALS.length = 0;
    MATERIALS.push(...mapped);
    if (!MATERIALS.find(m=>m.id===S.materialId)) S.materialId = MATERIALS[0].id;
    renderStep(); updateAllUI();
    console.log('[FB] 已載入雲端材料清單', MATERIALS.length, '筆');
  } catch(e){
    console.error('[FB] 材料清單載入失敗，沿用內建預設', e);
  }
}
/* admin 權限判斷：讀 users/{uid}，與 portal 的 hasPerm('admin') 同邏輯（permissions 含 admin 或 role===admin） */
async function checkAdmin(uid){
  try {
    const snap = await FB.db.collection('users').doc(uid).get();
    const d = snap.exists ? snap.data() : null;
    S.isAdmin = !!d && (d.role==='admin' || (Array.isArray(d.permissions) && d.permissions.includes('admin')));

}

function cloudAddHistory(act, sum){

      .catch(e=>console.error('[FB] history 寫入失敗', e));

  }

/* ============================== 4. 3D 檢視器 ============================== */
const V = {};   // viewer namespace
function initViewer(){
  const canvas = $('#c3d');
  V.renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  V.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  V.renderer.localClippingEnabled = true;
  V.scene = new THREE.Scene();
  V.camera = new THREE.PerspectiveCamera(38, 1, 0.1, 4000);
  V.scene.add(new THREE.AmbientLight(0xffffff, .65));
  const dl = new THREE.DirectionalLight(0xffffff, .7); dl.position.set(80,160,120); V.scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xcfe8f2, .35); dl2.position.set(-120,60,-80); V.scene.add(dl2);

  V.platGroup = new THREE.Group(); V.scene.add(V.platGroup);
  buildPlatform();

  V.clipPlane = new THREE.Plane(new THREE.Vector3(0,-1,0), 1e6);
  V.matModel = new THREE.MeshStandardMaterial({ color:0x5bb8d4, metalness:.05, roughness:.55, vertexColors:true, clippingPlanes:[V.clipPlane], clipShadows:true });
  V.matSup   = new THREE.MeshStandardMaterial({ color:0xe9ecf0, roughness:.55, metalness:.02, clippingPlanes:[V.clipPlane] });
  V.matTp    = new THREE.MeshStandardMaterial({ color:0x2f6fd6, roughness:.35, clippingPlanes:[V.clipPlane] });
  V.matTpType = {   // 接觸點依類型上色（同 PreForm：橙/青/粉/綠）
    minima: new THREE.MeshStandardMaterial({ color:0xe8930c, roughness:.35, clippingPlanes:[V.clipPlane] }),
    over:   new THREE.MeshStandardMaterial({ color:0x0d9488, roughness:.35, clippingPlanes:[V.clipPlane] }),
    stab:   new THREE.MeshStandardMaterial({ color:0xd6409f, roughness:.35, clippingPlanes:[V.clipPlane] }),
    rein:   new THREE.MeshStandardMaterial({ color:0x46a758, roughness:.35, clippingPlanes:[V.clipPlane] }),
  };
  V.matMark  = new THREE.MeshStandardMaterial({ color:0xc0392b, roughness:.4, emissive:0x400000 });
  V.matDrain = new THREE.MeshStandardMaterial({ color:0xd97706, roughness:.4, emissive:0x402000 });

  V.modelGroup = new THREE.Group();   // 旋轉+定位後的模型
  V.supGroup = new THREE.Group();     // 支撐
  V.markGroup = new THREE.Group();    // 孤島/風險/排液孔標記
  V.scene.add(V.modelGroup, V.supGroup, V.markGroup);

  // 軌道控制 + PreForm 式操縱器（環=繞軸旋轉、拖模型=移動、點空白=轉視角）
  V.theta = 0.62; V.phi = 1.08; V.radius = 300; V.target = new THREE.Vector3(0,38,0);
  let dragging=false, panning=false, px=0, py=0;
  let dragModel=false, moved=false, grabPlane=null, grabMeshPos=null;
  let ringAxis=null, ringStart=0, ringDelta=0;
  let dragClampNotified=false;   // 硬性邊界提醒：同一次拖曳只跳一次
  V.ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
  const setRay = e => {
    const r = canvas.getBoundingClientRect();
    ndc.x = ((e.clientX-r.left)/r.width)*2-1;
    ndc.y = -((e.clientY-r.top)/r.height)*2+1;
    V.ray.setFromCamera(ndc, V.camera);
  };
  const pickModel = e => {
    const m = activeModel(); if (!m || !m.mesh) return null;
    setRay(e);
    const hits = V.ray.intersectObject(m.mesh, false);
    return hits[0] || null;
  };
  const pickRing = e => {
    if (!V.gizmoPicks || !V.gizmoPicks.length) return null;
    setRay(e);
    const hits = V.ray.intersectObjects(V.gizmoPicks, false);
    return hits[0] ? hits[0].object.userData.axis : null;
  };
  const planeHit = e => {   // 指標射線與平台平面 y=0 的交點
    setRay(e);
    const o = V.ray.ray.origin, d = V.ray.ray.direction;
    if (Math.abs(d.y) < 1e-6) return null;
    const t = -o.y / d.y;
    return t>0 ? new THREE.Vector3(o.x+d.x*t, 0, o.z+d.z*t) : null;
  };
  const ringAngleAt = (axis, e) => {   // 指標射線與環平面交點的極角
    setRay(e);
    const B = V.gizmoBasis[axis], P = V.gizmoCenter;
    const o = V.ray.ray.origin, d = V.ray.ray.direction;
    const dn = d.dot(B.axis);
    if (Math.abs(dn) < 1e-5) return null;
    const t = P.clone().sub(o).dot(B.axis) / dn;
    if (t <= 0) return null;
    const v = o.clone().addScaledVector(d, t).sub(P);
    return Math.atan2(v.dot(B.w), v.dot(B.u));
  };
  const updateCam = () => {
    V.camera.position.set(
      V.target.x + V.radius*Math.sin(V.phi)*Math.cos(V.theta),
      V.target.y + V.radius*Math.cos(V.phi),
      V.target.z + V.radius*Math.sin(V.phi)*Math.sin(V.theta));
    V.camera.lookAt(V.target);
    syncCube();
  };
  V.updateCam = updateCam;
  updateCam();
  canvas.addEventListener('pointerdown', e=>{
    px=e.clientX; py=e.clientY; moved=false;
    canvas.setPointerCapture(e.pointerId);
    if (e.button===2 || e.button===1){ panning=true; return; }
    if (e.button!==0) return;
    const axis = pickRing(e);                    // 旋轉環優先
    if (axis){
      const a0 = ringAngleAt(axis, e);
      if (a0!==null){ ringAxis=axis; ringStart=a0; ringDelta=0; gizmoDragBegin(); return; }
    }
    const hit = pickModel(e);
    if (hit && S.faceDownMode){ applyFaceDown(hit); return; }
    if (hit){                                   // 點到模型 → 選取並準備拖移
      selectModel();
      dragModel=true;
      dragClampNotified=false;                  // 新的一次拖曳 → 重置邊界提醒
      grabPlane = planeHit(e) || new THREE.Vector3();
      grabMeshPos = activeModel().mesh.position.clone();
      canvas.style.cursor='grabbing';
    } else {                                     // 點到空白 → 轉視角並取消選取
      deselectModel();
      dragging=true;
    }
  });
  canvas.addEventListener('pointerup', ()=>{
    if (ringAxis){ const ax=ringAxis, d=ringDelta; ringAxis=null; commitGizmo(ax, d); }
    if (dragModel){ dragModel=false; canvas.style.cursor='';
      if (moved) commitModelDrag(); }
    dragging=false; panning=false;
  });
  canvas.addEventListener('pointermove', e=>{
    if (!dragging && !panning && !dragModel && !ringAxis) return;

/* ============================== 5. 檔案解析 ============================== */
async function parseFile(file){
  const name = file.name.toLowerCase();
  const buf = await file.arrayBuffer();
  if (name.endsWith('.stl')) return parseSTL(buf);
  if (name.endsWith('.obj')) return parseOBJ(new TextDecoder().decode(buf));
  if (name.endsWith('.3mf')) return await parse3MF(buf);
  throw new Error('不支援的檔案格式（僅支援 STL / OBJ / 3MF）');
}
/* 回傳非索引三角形頂點陣列 Float32Array [x,y,z ×3 ×n]（Z-up 轉 Y-up 於 STL/3MF） */
function parseSTL(buf){
  const head = new Uint8Array(buf, 0, Math.min(512, buf.byteLength));
  const headTxt = new TextDecoder().decode(head);
  const isAscii = /^\s*solid/.test(headTxt) && headTxt.includes('facet');
  if (isAscii){
    const txt = new TextDecoder().decode(buf);
    const re = /vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)/g;
    const arr = []; let m;
    while ((m = re.exec(txt))) arr.push(+m[1], +m[3], -(+m[2]));   // Z-up→Y-up
    if (arr.length < 9 || arr.length % 9 !== 0) throw new Error('ASCII STL 格式錯誤');
    return new Float32Array(arr);
  }
  const dv = new DataView(buf);
  if (buf.byteLength < 84) throw new Error('STL 檔案毀損');
  const n = dv.getUint32(80, true);
  if (84 + n*50 > buf.byteLength) throw new Error('二進位 STL 長度不符');
  const out = new Float32Array(n*9);
  let o = 84, k = 0;
  for (let i=0;i<n;i++){
    o += 12; // skip normal
    for (let v=0;v<3;v++){
      const x=dv.getFloat32(o,true), y=dv.getFloat32(o+4,true), z=dv.getFloat32(o+8,true);
      out[k++]=x; out[k++]=z; out[k++]=-y; o+=12;   // Z-up→Y-up
    }
    o += 2;
  }
  return out;
}
function parseOBJ(txt){
  const vs=[], arr=[];
  const lines = txt.split(/\r?\n/);
  for (const ln of lines){
    if (ln[0]==='v' && ln[1]===' '){
      const p = ln.slice(2).trim().split(/\s+/);
      vs.push(+p[0], +p[1], +p[2]);              // OBJ 慣例已為 Y-up
    } else if (ln[0]==='f'){
      const p = ln.slice(1).trim().split(/\s+/).map(t=>{
        let i = parseInt(t.split('/')[0],10);
        if (i<0) i = vs.length/3 + i + 1;
        return (i-1)*3;
      });
      for (let i=1;i<p.length-1;i++){
        for (const ix of [p[0],p[i],p[i+1]]) arr.push(vs[ix],vs[ix+1],vs[ix+2]);
      }
    }
  }
  if (!arr.length) throw new Error('OBJ 無有效面資料');
  return new Float32Array(arr);
}
/* 3MF = ZIP，以瀏覽器原生 DecompressionStream 解壓（免外部函式庫） */
async function parse3MF(buf){

  let eocd = -1;
  for (let i=buf.byteLength-22; i>=Math.max(0,buf.byteLength-70000); i--){
    if (dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if (eocd<0) throw new Error('3MF(ZIP) 結構錯誤');
  const cnt = dv.getUint16(eocd+10,true);
  let off = dv.getUint32(eocd+16,true);
  const entries = [];
  for (let i=0;i<cnt;i++){
    if (dv.getUint32(off,true)!==0x02014b50) break;
    const method = dv.getUint16(off+10,true);
    const csize = dv.getUint32(off+20,true);
    const nlen = dv.getUint16(off+28,true), elen = dv.getUint16(off+30,true), clen = dv.getUint16(off+32,true);
    const lho = dv.getUint32(off+42,true);
    const name = new TextDecoder().decode(u8.subarray(off+46, off+46+nlen));
    entries.push({ name, method, csize, lho });
    off += 46 + nlen + elen + clen;
  }
  const ent = entries.find(e=>/3dmodel\.model$/i.test(e.name)) || entries.find(e=>/\.model$/i.test(e.name));
  if (!ent) throw new Error('3MF 內找不到 3dmodel.model');

    const ds = new DecompressionStream('deflate-raw');
    xmlBytes = new Uint8Array(await new Response(new Blob([comp]).stream().pipeThrough(ds)).arrayBuffer());
  } else throw new Error('3MF 使用不支援的壓縮法');
  const xml = new DOMParser().parseFromString(new TextDecoder().decode(xmlBytes), 'application/xml');
  const unit = (xml.querySelector('model')?.getAttribute('unit')||'millimeter').toLowerCase();
  const scale = { micron:.001, millimeter:1, centimeter:10, inch:25.4, foot:304.8, meter:1000 }[unit] ?? 1;
  const objects = {};
  xml.querySelectorAll('object').forEach(ob=>{
    const meshEl = ob.querySelector('mesh'); if(!meshEl) return;
    const vs=[];
    meshEl.querySelectorAll('vertices > vertex').forEach(v=>vs.push(+v.getAttribute('x')*scale, +v.getAttribute('y')*scale, +v.getAttribute('z')*scale));
    const tris=[];
    meshEl.querySelectorAll('triangles > triangle').forEach(t=>tris.push(+t.getAttribute('v1'), +t.getAttribute('v2'), +t.getAttribute('v3')));
    objects[ob.getAttribute('id')] = { vs, tris };
  });
  const items = Array.from(xml.querySelectorAll('build > item'));
  const arr = [];
  const push = (o, m)=>{
    for (let i=0;i<o.tris.length;i++){
      const vi = o.tris[i]*3;
      let x=o.vs[vi], y=o.vs[vi+1], z=o.vs[vi+2];
      if (m){ const nx=m[0]*x+m[3]*y+m[6]*z+m[9], ny=m[1]*x+m[4]*y+m[7]*z+m[10], nz=m[2]*x+m[5]*y+m[8]*z+m[11]; x=nx;y=ny;z=nz; }
      arr.push(x, z, -y);                      // 3MF Z-up→Y-up
    }
  };
  if (items.length){
    for (const it of items){
      const o = objects[it.getAttribute('objectid')]; if(!o) continue;
      const tr = it.getAttribute('transform');
      push(o, tr ? tr.trim().split(/\s+/).map(Number) : null);
    }
  } else Object.values(objects).forEach(o=>push(o,null));
  if (!arr.length) throw new Error('3MF 無網格資料');
  return new Float32Array(arr);
}

/* ============================== 6. 網格核心 ============================== */
/* 頂點焊接 → 索引網格；回傳 {verts:Float32Array, tris:Uint32Array} */
function weldMesh(pos, eps=1e-4){
  const map = new Map(); const verts=[]; const tris=new Uint32Array(pos.length/3);
  const inv = 1/eps;
  for (let i=0;i<pos.length;i+=3){
    const key = Math.round(pos[i]*inv)+'_'+Math.round(pos[i+1]*inv)+'_'+Math.round(pos[i+2]*inv);
    let id = map.get(key);
    if (id===undefined){ id = verts.length/3; map.set(key,id); verts.push(pos[i],pos[i+1],pos[i+2]); }
    tris[i/3] = id;
  }
  return { verts:new Float32Array(verts), tris };
}
/* 移除退化三角形，回傳新 tris 與移除數 */
function removeDegenerate(verts, tris){
  const keep=[]; let removed=0;
  for (let f=0; f<tris.length; f+=3){
    const a=tris[f],b=tris[f+1],c=tris[f+2];
    if (a===b||b===c||a===c){ removed++; continue; }
    const area = triArea(verts,a,b,c);
    if (area < 1e-10){ removed++; continue; }
    keep.push(a,b,c);
  }
  return { tris:new Uint32Array(keep), removed };
}
function triArea(v,a,b,c){
  const ax=v[a*3],ay=v[a*3+1],az=v[a*3+2], bx=v[b*3],by=v[b*3+1],bz=v[b*3+2], cx=v[c*3],cy=v[c*3+1],cz=v[c*3+2];
  const ux=bx-ax,uy=by-ay,uz=bz-az, wx=cx-ax,wy=cy-ay,wz=cz-az;
  const x=uy*wz-uz*wy, y=uz*wx-ux*wz, z=ux*wy-uy*wx;
  return Math.sqrt(x*x+y*y+z*z)/2;
}
/* 邊拓撲：水密/非流形/邊界統計 + 法線一致性修復(BFS翻面) */
function edgeTopology(verts, tris){
  const edge = new Map();  // key a<b → [count, dirSum]
  const nf = tris.length/3;
  for (let f=0; f<nf; f++){
    const i=f*3, vs=[tris[i],tris[i+1],tris[i+2]];
    for (let e=0;e<3;e++){
      const a=vs[e], b=vs[(e+1)%3];
      const key = a<b ? a+'_'+b : b+'_'+a;
      const rec = edge.get(key) || [0,0];
      rec[0]++; rec[1] += (a<b ? 1 : -1);
      edge.set(key, rec);
    }
  }
  let boundary=0, nonManifold=0, flipped=0;
  edge.forEach(r=>{
    if (r[0]===1) boundary++;
    else if (r[0]>2) nonManifold++;
    else if (r[0]===2 && r[1]!==0) flipped++;   // 同向兩次 = 相鄰面朝向不一致
  });

}
/* 面朝向統一：BFS 傳播，若鄰面共享邊同向則翻轉 */
function unifyOrientation(verts, tris){
  const nf = tris.length/3;
  const halfMap = new Map();  // "a_b" 有向邊 → faceIdx
  const key = (a,b)=>a+'_'+b;
  for (let f=0; f<nf; f++){
    const i=f*3;
    halfMap.set(key(tris[i],tris[i+1])+'#'+f, f);
  }
  // 建鄰接：無向邊 → faces
  const und = new Map();
  for (let f=0; f<nf; f++){
    const i=f*3, vs=[tris[i],tris[i+1],tris[i+2]];
    for (let e=0;e<3;e++){
      const a=vs[e], b=vs[(e+1)%3];
      const k = a<b ? a+'_'+b : b+'_'+a;
      if (!und.has(k)) und.set(k, []);
      und.get(k).push(f);
    }
  }
  const visited = new Uint8Array(nf);
  let flips = 0;
  const dirOf = (f,a,b)=>{ const i=f*3;
    for (let e=0;e<3;e++){ if (tris[i+e]===a && tris[i+(e+1)%3]===b) return 1;
                           if (tris[i+e]===b && tris[i+(e+1)%3]===a) return -1; }
    return 0; };
  const flip = f=>{ const i=f*3; const t=tris[i+1]; tris[i+1]=tris[i+2]; tris[i+2]=t; flips++; };
  for (let seed=0; seed<nf; seed++){
    if (visited[seed]) continue;
    visited[seed]=1; const q=[seed];
    while (q.length){

      for (let e=0;e<3;e++){

/* 有號體積 (mm³) 與表面積 (mm²) */
function volumeArea(verts, tris){
  let vol=0, area=0;
  for (let f=0; f<tris.length; f+=3){
    const a=tris[f]*3,b=tris[f+1]*3,c=tris[f+2]*3;
    const ax=verts[a],ay=verts[a+1],az=verts[a+2], bx=verts[b],by=verts[b+1],bz=verts[b+2], cx=verts[c],cy=verts[c+1],cz=verts[c+2];
    vol += (ax*(by*cz-bz*cy) + bx*(cy*az-cz*ay) + cx*(ay*bz-az*by)) / 6;
    const ux=bx-ax,uy=by-ay,uz=bz-az, wx=cx-ax,wy=cy-ay,wz=cz-az;
    const x=uy*wz-uz*wy, y=uz*wx-ux*wz, z=ux*wy-uy*wx;
    area += Math.sqrt(x*x+y*y+z*z)/2;

function bboxOf(arr){
  const bb = { min:[1e30,1e30,1e30], max:[-1e30,-1e30,-1e30] };
  for (let i=0;i<arr.length;i+=3){
    for (let k=0;k<3;k++){ const v=arr[i+k];
      if (v<bb.min[k]) bb.min[k]=v; if (v>bb.max[k]) bb.max[k]=v; }
  }
  bb.size = [bb.max[0]-bb.min[0], bb.max[1]-bb.min[1], bb.max[2]-bb.min[2]];

/* 連通元件（殼）數量 */
